<style>
/* 工房の帳面: 上に残高（マナ）、中央に作業台、下にタブ。片手の親指で全部届く縦長レイアウト。 */

}

    --brass: #d9a94f; --brass-soft: #3a2f1a; --mana: #9eabff; --mana-soft: #262c52; --ok: #6fcf9b; --ok-soft: #1c3a2a; --bad: #ff8f78;
    --r0: #9aa6a3; --r1: #8cc46f; --r2: #6fb5ea; --r3: #b893f2; --r4: #f0bf4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111918; --surface: #1a2422; --surface2: #23302d; --ink: #e5ece9; --muted: #95a5a1; --line: #2f3d3a;
  --brass: #d9a94f; --brass-soft: #3a2f1a; --mana: #9eabff; --mana-soft: #262c52; --ok: #6fcf9b; --ok-soft: #1c3a2a; --bad: #ff8f78;

}

* { box-sizing: border-box; }
body {

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 上部: 残高 */
.top {

.top { flex-wrap: wrap; row-gap: 8px; }
.goal { order: 3; flex: 1 0 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; row-gap: 4px; align-items: center; text-align: left; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.goal .gl { font-size: 11px; font-weight: 700; color: var(--surface); background: var(--brass); border-radius: 6px; padding: 1px 6px; letter-spacing: .08em; }
.goal .gt { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.goal .gb { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }

.goal.ok { border-color: var(--ok); }
.goal.ok .gl { background: var(--ok); }
.tabs button.new::after { content: ""; position: absolute; top: 8px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--mana); }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

main { padding-block: 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px); max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 17px; margin: 0; }

p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.lack { color: var(--bad); }

/* 下部: タブ */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(var(--ntabs, 6), minmax(0, 1fr));
}
.tabs button {
  height: var(--nav-h); border: 0; background: none; cursor: pointer; position: relative; min-width: 0;
  font-size: 11px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; white-space: nowrap;
}
.tabs button .k { font-family: var(--f-display); font-size: 19px; font-weight: 800; line-height: 1; }
.tabs button[aria-selected="true"] { color: var(--brass); }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brass); }
.badge { position: absolute; top: 6px; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--ok); color: var(--surface); font-size: 11px; font-weight: 700; line-height: 18px; }

/* 共通部品 */
.btn {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 10px;
  min-height: 40px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.25; text-align: center;
}
.btn.pri { background: var(--brass); border-color: var(--brass); color: var(--surface); font-weight: 700; }
.btn.mana { background: var(--mana-soft); border-color: transparent; color: var(--mana); font-weight: 700; }
.btn.okb { background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 700; }
.btn:disabled { opacity: .42; cursor: default; }
.btn small { font-weight: 400; font-size: 12px; opacity: .9; }
.btn .cf { display: none; }
.btn.armed .lbl { display: none; }
.btn.armed .cf { display: inline; }
.btn.armed { background: var(--brass-soft); color: var(--brass); border-color: var(--brass); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts .btn { flex: 1 1 120px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 100%; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; min-height: 36px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass-soft); color: var(--brass); font-weight: 700; }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.chip.locked { color: var(--muted); border-style: dashed; }
.r0 { --rc: var(--r0); } .r1 { --rc: var(--r1); } .r2 { --rc: var(--r2); } .r3 { --rc: var(--r3); } .r4 { --rc: var(--r4); }
.rc { color: var(--rc); }
.prog { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--brass); border-radius: 4px; transition: width .2s; }

.tag.none { background: var(--surface2); color: var(--muted); }

/* 採取 */
.area-head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.tapzone { position: relative; display: grid; place-items: center; padding-block: 8px; overflow: hidden; border-radius: 16px; }
.tap {
  width: min(62vw, 230px); max-width: 100%; aspect-ratio: 1; border-radius: 50%;
  border: 2px solid var(--brass); cursor: pointer; user-select: none; -webkit-user-select: none;
  background: radial-gradient(circle at 50% 38%, var(--mana-soft) 0%, var(--surface) 68%);
  box-shadow: inset 0 0 0 9px var(--surface), inset 0 0 0 10px var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .07s ease-out;
}
.tap b { font-family: var(--f-display); font-size: 26px; font-weight: 800; }
.tap small { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.tap.hit { transform: scale(.955); }
.pt { position: absolute; pointer-events: none; font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--rc); text-shadow: 0 1px 0 var(--bg); animation: rise .95s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -64px); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .lab { font-size: 12px; color: var(--muted); }
.stat b { font-size: 18px; overflow-wrap: anywhere; line-height: 1.25; }
.stat small { font-size: 11px; color: var(--muted); }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--brass); flex: none; }

/* 一覧の行（素材・レシピ・道具） */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.item .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.item .meta { font-size: 12px; color: var(--muted); }
.item .own { font-size: 13px; white-space: nowrap; }
.item .own b { font-size: 16px; }
.item.unknown .nm { color: var(--muted); letter-spacing: .1em; }
.item.sel { box-shadow: 0 0 0 2px var(--mana) inset; }
.ins { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; }

/* ホムンクルス */
.hom { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.hom.sel { box-shadow: 0 0 0 2px var(--mana) inset; }
.hom .nm { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.hom .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.sc { position: relative; background: var(--surface2); border-radius: 8px; padding: 4px 8px 6px; display: flex; align-items: baseline; gap: 4px; overflow: hidden; min-width: 0; }
.sc .sl { font-size: 11px; color: var(--muted); }
.sc b { font-size: 15px; }
.sc .cap { font-size: 11px; color: var(--muted); }
.sc .arrow { color: var(--ok); margin-left: 2px; }
.sc i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brass); }
.sc.max b { color: var(--brass); }
.tag.top { background: var(--brass-soft); color: var(--brass); font-weight: 700; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.panel.fuse { border-color: var(--mana); }

/* 迷宮 */
.mzst { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); }
.mzst b { color: var(--ink); }
.hpline { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.hpbar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--ok); }
.hpline.down { color: var(--muted); }
.paths { display: flex; flex-direction: column; gap: 8px; }
.path { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.path b { font-family: var(--f-display); font-size: 16px; }
.path.foe { border-left-color: var(--r2); } .path.elite { border-left-color: var(--r3); } .path.boss { border-left-color: var(--bad); }
.path.chest { border-left-color: var(--r4); } .path.spring { border-left-color: var(--ok); } .path.altar { border-left-color: var(--mana); }

/* 道具 */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slot .lab { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.slot b { font-family: var(--f-display); font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }

.card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
.card .num { font-size: 12px; color: var(--muted); margin-top: auto; }
.card.unknown { background: var(--surface2); border-top-color: var(--line); }

/* 師匠の手記 */
.journal { display: flex; flex-direction: column; gap: 12px; }
.page { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.page h3 { font-size: 19px; }
.page p { font-family: var(--f-display); font-size: 15px; line-height: 1.9; max-width: 34em; }
.page .no { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.page.locked { background: var(--surface2); border-left-color: var(--line); padding-block: 10px; }
.page.locked p { font-family: var(--f-body); font-size: 13px; }

/* ミッション */
.bonus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13px; }

.mis { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

.rw { font-size: 12px; font-weight: 700; color: var(--brass); background: var(--brass-soft); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.mis .tx { font-size: 14px; color: var(--muted); }

.mis.ready { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }

/* 強化 */
.up { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }

/* 設定シート */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px; font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; word-break: break-all; }

/* 通知 */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 14px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgb(0 0 0 / .2); animation: tin .2s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {

}
</style>

const fresh = () => ({

  run: 1, mc: {}, stones: 0, pu: {}, journal: {}, jread: {}, open: {}, newTab: {}, life: { totalMana: 0, prestiges: 0, bestStones: 0, mazeBest: 0 }, maze: null, mazeTeam: [],

function normalize(o) {
  const f = fresh();
  if (!o || typeof o !== 'object') return f;
  for (const k in f) {
    if (o[k] === undefined || o[k] === null) continue;
    if (typeof f[k] === 'object' && !Array.isArray(f[k])) {
      f[k] = Object.assign(f[k], o[k]);
      if (k === 'st') for (const kk of ['areaTaps', 'crafted']) f.st[kk] = Object.assign({}, o.st[kk] || {});
    } else f[k] = o[k];
  }
  if (!AREA[f.area] || !f.unlocked[f.area]) f.area = 'a1';
  if (!Array.isArray(f.tools)) f.tools = [];
  if (!Array.isArray(f.homs)) f.homs = [];
  f.homs = f.homs.filter(h => h && KIND[h.k]);
  delete f.party;
  if (!Array.isArray(f.mazeTeam)) f.mazeTeam = [];
  f.mazeTeam = f.mazeTeam.filter(u => f.homs.some(h => h.u === u)).slice(0, 3);
  if (f.maze && (!Array.isArray(f.maze.team) || !f.maze.team.some(u => f.homs.some(h => h.u === u)))) f.maze = null;
  // 道具だった頃のセーブ: 装備していた道具を、同じ枠の役目のホムンクルスに変えて引き継ぐ
  if ((o.v || 1) < 5 && Array.isArray(o.tools) && o.eq) {
    const byTool = { hand: 'koro', waist: 'happa', neck: 'happa' };
    const slotOf = b => /Pick$/.test(b) ? 'hand' : /Flute$|Bell$|Horn$/.test(b) ? 'waist' : 'neck';
    for (const slot of ['hand', 'waist', 'neck']) {
      const t = o.tools.find(x => x && x.u === o.eq[slot]);
      if (!t) continue;
      const k = KIND[byTool[slotOf(t.b)]];
      const h = { u: f.homSeq++, k: k.id, lv: 1, xp: 0, f: 0, s: {}, sk: [] };
      for (const st of STAT_IDS) h.s[st] = Math.round(capOf(h, st) * (0.2 + 0.5 * (t.q || 0)));
      h.sk = Object.entries(t.t || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, lv]) => ({ id, r: Math.min(RANK_MAX, Math.floor(Math.log2(lv + 1))) }));
      f.homs.push(h);
    }
    f.st.homsMade = Math.max(f.st.homsMade || 0, o.st && o.st.toolsMade ? 1 : 0);
  }
  // 使い魔が1種類だった頃のセーブは、そのレベルを裏山の使い魔に引き継ぐ
  if (f.up.familiar !== undefined) { if (!f.up.fam_a1) f.up.fam_a1 = f.up.familiar; delete f.up.familiar; }
  // 探索の回数を記録していなかった頃のセーブは、裏山の探索を累計の採取回数で補う
  if (!f.st.areaTaps.a1) f.st.areaTaps.a1 = (f.st.manual || 0) + (f.st.auto || 0) - (f.st.areaTaps.a2 || 0) - (f.st.areaTaps.a3 || 0);
  for (const i of ITEMS) if ((f.inv[i.id] || 0) > 0 || (f.col[i.id] || 0) > 0 || (f.st.crafted[i.id] || 0) > 0) f.reg[i.id] = true;
  if (!Array.isArray(f.reqs)) f.reqs = [];
  f.reqs = f.reqs.filter(r => r && (r.wait || ITEM[r.id]));
  // 第1版の任務IDは内容が変わったので、同じ内容のものだけ引き継ぐ
  if ((o.v || 1) < 2) {
    const keep = {};
    if (o.done) { if (o.done.m1) keep.m1 = 1; if (o.done.m2) keep.m2 = 1; if (o.done.m3) keep.m3 = 1; if (o.done.m4) keep.m4 = 1; if (o.done.m6) keep.m7 = 1; if (o.done.m10) keep.m13 = 1; if (o.done.m11) keep.m12 = 1; if (o.done.m14) keep.m15 = 1; }
    f.done = keep;
  }
  // 精錬が「無限に近づく」方式だった頃の回数を、20段階に置き換える（品質は下がらないように切り上げ）
  if ((o.v || 1) < 3) {
    for (const id in f.ref) { const n = f.ref[id] || 0; f.ref[id] = Math.min(REF_MAX, Math.ceil((1 - 0.9 ** n) * REF_MAX - 1e-9)); }
  }
  // ミッションの達成回数（周回をまたいで残る）を、それまでの達成済みから作る
  if ((o.v || 1) < 4) {
    f.mc = {}; for (const id in f.done) if (f.done[id]) f.mc[id] = 1;
    f.life.totalMana = Math.max(f.life.totalMana, f.st.totalMana || 0);
    delete f.autoCraft;
  }
  delete f.tools; delete f.eq; delete f.toolSeq;
  // 少しずつ開く仕組みがなかった頃のセーブは、条件を満たしている機能を黙って開く
  if ((o.v || 1) < 6) f._migrateOpen = true;
  f.v = 6;
  return f;
}

const regCount = () => ITEMS.filter(i => S.reg[i.id]).length;
function mult(type) { let x = 1; for (const m of MIS) if (m.rw[0] === type && S.mc[m.id]) x *= m.rw[1] ** S.mc[m.id]; return x; }
const misOpen = m => (S.mc[m.id] || 0) < S.run;
const misBehind = m => S.run - (S.mc[m.id] || 0);
const pu = id => S.pu[id] || 0;

const kindHoms = k => S.homs.filter(h => h.k === k);
// 種類ごとに、能力値と技能はそれぞれ「その種類で一番高い子」のものが効く
const kindBest = (k, st) => kindHoms(k).reduce((a, h) => Math.max(a, h.s[st]), 0);
const statSum = st => KINDS.reduce((a, k) => a + kindBest(k.id, st), 0);
// 能力値1ポイントごとに効果が2%ずつ掛け算で伸びる
const statMult = st => 1.02 ** statSum(st);
function kindRank(k, id) { let r = -1; for (const h of kindHoms(k)) for (const x of h.sk) if (x.id === id && x.r > r) r = x.r; return r; }

function genChoices(fl) {
  if (fl % 10 === 0) return [{ t: 'boss' }];
  const pick = () => { const r = Math.random(); return r < 0.45 ? 'foe' : r < 0.6 ? 'elite' : r < 0.75 ? 'chest' : r < 0.88 ? 'spring' : 'altar'; };
  const c = [pick(), pick(), pick()].map(t => ({ t }));
  if (!seeAll()) c[Math.floor(Math.random() * 3)].hide = true;
  return c;
}
function mzStart() {
  const team = S.mazeTeam.map(homById).filter(Boolean);
  if (!team.length) return false;
  const hp = {}; for (const h of team) hp[h.u] = cstat(h, team, 0).maxhp;
  S.maze = { floor: 1, team: team.map(h => h.u), hp, buff: 0, bag: { mana: 0, items: {}, stones: 0 }, choices: genChoices(1), log: ['迷宮に入った。'] };
  return true;
}
function mzFight(kind) {
  const m = S.maze, team = mzTeam(), fl = m.floor;
  const foe = foeStats(fl, kind);
  const cs = Object.fromEntries(team.map(h => [h.u, cstat(h, team, m.buff)]));
  let fhp = foe.hp, hits = 0, crits = 0, taken = 0, rounds = 0;
  const alive = () => team.filter(h => m.hp[h.u] > 0);
  while (fhp > 0 && alive().length && rounds < 40) {
    rounds++;
    for (const h of alive()) {
      const c = cs[h.u];
      const n = 1 + (Math.random() < c.dbl ? 1 : 0);
      for (let i = 0; i < n && fhp > 0; i++) { const cr = Math.random() < c.crit; fhp -= c.atk * (cr ? 2 : 1) * (0.85 + Math.random() * 0.3); hits++; if (cr) crits++; }
    }
    if (fhp <= 0) break;
    const tg = alive(); const t = tg[Math.floor(Math.random() * tg.length)];
    if (Math.random() < cs[t.u].dodge) continue;
    const d = Math.round(foe.atk * (0.85 + Math.random() * 0.3));
    m.hp[t.u] = Math.max(0, m.hp[t.u] - d); taken += d;
  }
  const down = team.filter(h => m.hp[h.u] <= 0).map(h => KIND[h.k].name);
  if (fhp > 0) {
    // 全滅（または決着がつかない）: 集めた報酬の半分を失って戻る
    const lost = m.bag.mana / 2;
    m.bag.mana -= lost;
    for (const id in m.bag.items) m.bag.items[id] = Math.floor(m.bag.items[id] / 2);
    m.bag.stones = Math.floor(m.bag.stones / 2);
    m.log = [`${foe.name}に敗れた……（${rounds}ターン）。持ち物の半分を落として逃げ帰った。`];
    return mzReturn(true);
  }
  const gain = mzReward(fl, kind);
  m.bag.mana += gain;
  let extra = '';
  if (kind === 'boss' && fl >= 30) { m.bag.stones++; extra = '　賢者の石を1個見つけた！'; }
  const xp = 3 * fl * (kind === 'boss' ? 4 : kind === 'elite' ? 2 : 1) * (1 + 0.1 * teamTrait(team, 'skill'));
  for (const h of team) if (m.hp[h.u] > 0) giveExp(h, xp);
  m.log = [`${foe.name}を倒した！（${rounds}ターン、攻撃${hits}回${crits ? `・会心${crits}回` : ''}）　受けたダメージ ${fmt(taken)}${down.length ? `　${down.join('・')}が倒れた` : ''}`, `+${fmt(gain)} マナ　経験値 +${fmt(xp)}${extra}`];
  return true;
}
function giveExp(h, x) {
  if (h.lv >= LV_MAX) return;
  h.xp += x;
  const from = h.lv; let last = null;
  while (h.lv < LV_MAX && h.xp >= expNeed(h.lv)) { h.xp -= expNeed(h.lv); last = levelUp(h); }
  if (h.lv >= LV_MAX) h.xp = 0;
  if (last) toast(`${KIND[h.k].name}がLv${h.lv}になった！${h.lv - from > 1 ? '' : ' ' + (Object.entries(last.got).map(([st, n]) => STAT[st].name + '+' + n).join(' ') || '（伸びなかった）')}`, 3000);
}
function mzChest() {
  const m = S.maze, fl = m.floor;
  const gain = mzReward(fl, 'foe') * 1.5;
  m.bag.mana += gain;
  const pool = ITEMS.filter(i => i.kind === 'raw' && S.unlocked[i.area] && S.reg[i.id]).sort((a, b) => b.v - a.v);
  let got = '';
  if (pool.length) {
    const it = pool[Math.floor(Math.random() * Math.ceil(pool.length / 2))];
    const n = Math.ceil(10 * 1.15 ** fl);
    m.bag.items[it.id] = (m.bag.items[it.id] || 0) + n;
    got = `、${it.name} ×${fmt(n)}`;
  }
  m.log = [`宝箱を開けた。+${fmt(gain)} マナ${got}`];
}
function mzGo(i) {
  const m = S.maze; if (!m) return;
  const c = m.choices[i]; if (!c) return;
  let t = c.t;
  if (t === 'foe' || t === 'elite' || t === 'boss') { if (!mzFight(t)) return; if (!S.maze) return; }
  else if (t === 'chest') mzChest();
  else if (t === 'spring') { for (const h of mzTeam()) { const mx = cstat(h, mzTeam(), m.buff).maxhp; if (m.hp[h.u] > 0) m.hp[h.u] = Math.min(mx, m.hp[h.u] + Math.round(mx * 0.4)); } m.log = ['泉の水を飲んだ。HPが回復した。']; }
  else if (t === 'altar') { m.buff++; m.log = [`祭壇に祈った。攻撃力 +15%（この探索の間 合計+${m.buff * 15}%）`]; }
  m.floor++;
  if (m.floor - 1 > (S.life.mazeBest || 0)) S.life.mazeBest = m.floor - 1;
  m.choices = genChoices(m.floor);
}
function mzReturn(lost) {
  const m = S.maze; if (!m) return false;
  addMana(m.bag.mana);
  for (const id in m.bag.items) if (m.bag.items[id] > 0) addItem(id, m.bag.items[id]);
  S.stones += m.bag.stones;
  const items = Object.entries(m.bag.items).filter(([, n]) => n > 0).map(([id, n]) => `${ITEM[id].name}×${fmt(n)}`).join('、');
  toast(`${lost ? '命からがら' : '無事に'}帰還した（地下${m.floor}階）: +${fmt(m.bag.mana)} マナ${items ? '、' + items : ''}${m.bag.stones ? `、賢者の石 +${m.bag.stones}` : ''}`, 6000);
  S.mazeLast = m.log;
  S.maze = null;
  return false;
}

/* --- 依頼 --- */
const REQ_SLOTS = 3;
function newReq() {
  const pool = ITEMS.filter(i => S.reg[i.id] && S.unlocked[i.area]);
  if (!pool.length) return { wait: Date.now() + 15000 };
  const it = pool[Math.floor(Math.random() * pool.length)];
  const scale = 1 + Math.log10(1 + power());
  const n = Math.max(1, Math.ceil((5 + Math.random() * 20) * scale * (it.kind === 'proc' ? 0.3 : 1)));
  return { id: it.id, n, rw: n * unitMana(it.id) * 2.5 };
}
function refreshReqs() {
  const now = Date.now();
  for (let i = 0; i < REQ_SLOTS; i++) {
    const r = S.reqs[i];
    if (!r || (r.wait && r.wait <= now)) S.reqs[i] = newReq();
  }
}
function deliverReq(i) {
  const r = S.reqs[i];
  if (!r || r.wait || inv(r.id) < r.n) return false;
  S.inv[r.id] -= r.n;
  addMana(r.rw);
  S.fame++; S.st.reqDone++;
  S.reqs[i] = { wait: Date.now() + 40000 };
  toast(`依頼を達成: +${fmt(r.rw)} マナ、名声 +1`);
  return true;
}

const dz = fn => { B.push({ k: 'd', fn }); return `data-b="${B.length - 1}"${fn() ? ' disabled' : ''}`; };
const wd = fn => { B.push({ k: 'w', fn }); return `data-b="${B.length - 1}" style="width:${fn()}%"`; };

const regSig = ids => ids.map(id => S.reg[id] ? 2 : inv(id) > 0 ? 1 : 0).join('');
const confirmBtn = (cls, attrs, label, cf) => `<button class="btn ${cls}" type="button" ${attrs}><span class="lbl">${label}</span><span class="cf">${cf}</span></button>`;

function structKey() {
  const ua = Object.keys(S.unlocked).join(',') + '/' + Object.keys(S.open).join(',');
  switch (ui.tab) {
    case 'gather': return `g${ui.gArea}${ua}${S.up.autodis}`;
    case 'lab': {
      const base = `l${ui.labView}${ui.labArea}${ua}`;
      if (ui.labView === 'craft') return base + PROC.map(p => procOn(p) ? 1 : 0).join('');
      if (ui.labView === 'refine') return base + regSig(labIds()) + labIds().map(id => perfect(id) ? 1 : 0).join('');
      return base + regSig(labIds());
    }
    case 'tools': return `t${ua}|${S.homs.map(h => [h.u, h.lv, h.f, h.sk.map(k => k.id + k.r).join('')].join(':')).join(',')}|${ui.traitHelp ? 'h' : ''}`;
    case 'mission': return `m${ui.misView}${ui.misArea}${ua}${S.run}:${MIS.filter(misOpen).length}|${S.reqs.map(r => r ? (r.wait ? 'w' : r.id) : '-').join(',')}`;
    case 'maze': return `z${S.maze ? [S.maze.floor, S.maze.choices.map(c => c.t + (c.hide ? 'h' : '')).join(''), JSON.stringify(S.maze.hp), S.maze.log.join('')].join('|') : 'off' + S.mazeTeam.join(',') + S.homs.map(h => h.u + ':' + h.lv).join(',')}`;
    case 'book': return `b${ui.bookView || 'items'}${regCount()}${ua}${Object.keys(S.journal).length}`;
    case 'up': return 'u' + (ui.upView || 'shop') + S.up.autodis + Object.keys(S.unlocked).join(',') + S.run + JSON.stringify(S.pu);
  }
  return ui.tab;
}
function render() {
  B = [];
  const fn = { maze: vMaze, gather: vGather, lab: vLab, tools: vTools, mission: vMission, book: vBook, up: vUp }[ui.tab];
  main.innerHTML = fn();
  B.forEach((b, i) => { b.el = main.querySelector(`[data-b="${i}"]`); b.last = undefined; });
  lastKey = structKey();
  if (ui.tab === 'gather') {
    bindTap();
    const a = document.getElementById('autodis');
    if (a) a.addEventListener('change', () => { S.autoDis = a.checked; });
  }
  update();
}
function update() {
  if (structKey() !== lastKey) { render(); return; }
  for (const b of B) {
    if (!b.el) continue;
    const v = b.fn();
    if (v === b.last) continue;
    b.last = v;
    if (b.k === 't') b.el.textContent = v;
    else if (b.k === 'd') b.el.disabled = !!v;
    else if (b.k === 'w') b.el.style.width = v + '%';
    else if (b.k === 'c') b.el.classList.toggle(b.c, !!v);
  }
  document.getElementById('hMana').textContent = fmt(S.mana);
  const r = famTotal();
  const perSec = () => unlockedAreas().reduce((s, a) => s + famRate(a.id) * avgValue(a.id), 0) * power() * manaMult();
  document.getElementById('hRate').textContent = r <= 0 ? AREA[S.area].name :
    autoDisOn() ? `${AREA[S.area].name}　+${fmt(perSec())} /秒` : `${AREA[S.area].name}　使い魔 計${fmtD(r)} 回/秒`;
  const nReady = MIS.filter(m => misOpen(m) && S.unlocked[m.area] && ready(m)).length
    + S.reqs.filter(q => q && !q.wait && inv(q.id) >= q.n).length;
  const g = nextGoal();
  const ge = document.getElementById('goal');
  document.getElementById('goalText').textContent = g.text;
  document.getElementById('goalBar').style.width = Math.max(0, Math.min(1, g.r)) * 100 + '%';
  ge.classList.toggle('ok', !!g.ok);
  ge.dataset.tab = g.tab;
  const jb = document.getElementById('bookBadge');
  jb.hidden = unreadJournal() === 0;
  const bd = document.getElementById('misBadge');
  bd.hidden = nReady === 0; bd.textContent = nReady;
}
function areaChips(cur, act, opts = {}) {
  const list = AREAS.filter((a, i) => S.unlocked[a.id] || (opts.showNext && i > 0 && S.unlocked[AREAS[i - 1].id]));
  const chips = list.map(a => `<button type="button" class="chip${S.unlocked[a.id] ? '' : ' locked'}" data-act="${act}" data-id="${a.id}" aria-pressed="${a.id === cur}">${S.unlocked[a.id] ? '' : '未解放　'}${esc(a.name)}</button>`);
  if (opts.extra) chips.push(...opts.extra);
  return `<div class="chips">${chips.join('')}</div>`;
}

let tapHitTimer = 0;
function bindTap() {
  const t = document.getElementById('tap');
  const z = document.getElementById('tapzone');
  if (!t) return;
  const go = (x, y) => {
    S.area = ui.gArea;
    S.st.manual++;
    S.st.areaTaps[S.area] = (S.st.areaTaps[S.area] || 0) + exploreMult();
    S.skill += skillGain();
    gainExp(1);
    const got = gather(power());
    t.classList.add('hit');
    clearTimeout(tapHitTimer);
    tapHitTimer = setTimeout(() => t.classList.remove('hit'), 70);
    const zr = z.getBoundingClientRect();
    const ids = Object.keys(got).sort((a, b) => ITEM[b].v - ITEM[a].v).slice(0, 2);
    ids.forEach((id, k) => {
      if (z.querySelectorAll('.pt').length > 10) return;
      const p = document.createElement('div');
      const m = ITEM[id];
      p.className = 'pt r' + m.r;
      p.textContent = `+${fmt(got[id])} ${m.name}`;
      p.style.left = Math.min(Math.max(x - zr.left + (Math.random() * 40 - 20), 70), zr.width - 70) + 'px';
      p.style.top = (y - zr.top - 24 - k * 22) + 'px';
      z.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    });
    update();
  };
  t.addEventListener('pointerdown', e => { e.preventDefault(); go(e.clientX, e.clientY); });
  t.addEventListener('click', e => {
    if (e.detail !== 0) return; // キーボード操作のときだけ
    const r = t.getBoundingClientRect();
    go(r.left + r.width / 2, r.top + r.height / 2);
  });
}

function insHtml(ins, times = 1) {

function vLabCraft() {

/* --- 道具 --- */
const rankTag = k => `<span class="tag${k.r >= 5 ? ' top' : ''}">${TRAITS[k.id].name} ${RANKS[k.r]}</span>`;
const skillTags = h => {
  const free = slotsOf(h) - h.sk.length;
  return `<div class="tags">${h.sk.map(rankTag).join('')}${'<span class="tag none">空き</span>'.repeat(Math.max(0, free))}</div>`;
};
function statGrid(h, cmp) {
  return `<div class="sgrid">${STATS.map(st => {
    const v = h.s[st.id], c = capOf(h, st.id);
    const up = cmp && cmp[st.id] > v ? cmp[st.id] : null;
    return `<div class="sc${v >= c ? ' max' : ''}"><span class="sl">${st.name}</span><b>${up !== null ? `${v}<span class="arrow">→${up}</span>` : v}</b><span class="cap">/${c}</span><i style="width:${Math.min(100, v / c * 100)}%"></i></div>`;
  }).join('')}</div>`;
}
function homCard(h, acts, opts = {}) {
  const k = KIND[h.k];
  const ult = isUltimate(h);
  return `<div class="hom r${k.r}${opts.sel ? ' sel' : ''}">
    <div class="top-row"><span class="nm">${esc(k.name)}${ult ? ' <span class="tag top">究極</span>' : ''}</span><span class="own small">Lv <b>${tx(() => h.lv)}</b> / ${LV_MAX}${h.f ? `　融合${h.f}回` : ''}</span></div>
    ${h.lv < LV_MAX ? `<div class="prog thin"><i ${wd(() => h.lv >= LV_MAX ? 100 : h.xp / expNeed(h.lv) * 100)}></i></div>` : '<p class="small q">Lv上限。因果融合でさらに強くなれます</p>'}
    ${opts.compact ? '' : statGrid(h, opts.cmp)}
    ${skillTags(h)}
    ${acts ? `<div class="acts">${acts}</div>` : ''}
  </div>`;
}
function vTools() {
  const effects = STATS.map(st => `<div class="row-between"><span>${st.name}（${st.fx}）</span><b>${tx(() => st.id === 'luk' ? '目利き +' + fmtD(statSum('luk') / 10) : fmtX(statMult(st.id)))}</b></div>`).join('');
  const sk = TRAIT_IDS.filter(id => traitLv(id) > 0).map(id => `${TRAITS[id].name} ${TRAITS[id].now(traitLv(id))}`).join('、');
  const groups = KINDS.filter(k => kindHoms(k.id).length).map(k => {
    const hs = kindHoms(k.id).sort((a, b) => b.f - a.f || statTotal(b) - statTotal(a));
    const best = { k: k.id, f: Math.max(...hs.map(h => h.f)), s: {}, sk: [] };
    for (const st of STAT_IDS) best.s[st] = kindBest(k.id, st);
    best.sk = TRAIT_IDS.map(id => ({ id, r: kindRank(k.id, id) })).filter(x => x.r >= 0).sort((a, b) => b.r - a.r);
    const cards = hs.map(h => homCard(h, confirmBtn('', `data-act="release" data-id="${h.u}"`, `別れる <small>+${tx(() => fmt(homValue(h)))}</small>`, 'もう一度タップで別れる'))).join('');
    return `<div class="panel kind r${k.r}">
      <div class="row-between"><h3>${esc(k.name)}</h3><span class="small muted">${hs.length}人${best.f ? `　因果融合${best.f}回` : ''}</span></div>
      <p class="small muted">${esc(k.d)}</p>
      <h4>いま効いている力（この種類で一番高いもの）</h4>

      ${hs.length > 1 || hs[0].lv < LV_MAX ? `<h4>この種類の子たち</h4>` : ''}
      <div class="list">${cards}</div>
    </div>`;
  }).join('');
  const kinds = unlockedAreas().map(a => {
    const rows = KINDS.filter(k => k.area === a.id).map(k => {
      const mc = () => missingCost(k.in, 1);
      const bestSt = STAT_IDS.slice().sort((x, y) => k.g[y] - k.g[x]).slice(0, 2).map(st => STAT[st].name).join('・');
      return `<div class="item r${k.r}">
        <div class="top-row"><span class="nm">${esc(k.name)}</span><span class="own small muted">得意: ${bestSt}　いま${kindHoms(k.id).length}人</span></div>
        <p class="small muted">${esc(k.d)}</p>
        ${insHtml(k.in, 1)}
        <div class="acts">
          <button class="btn pri" type="button" data-act="mkhom" data-id="${k.id}" ${dz(() => canMake(k.in) < 1 || S.homs.length >= MAX_HOMS)}>生み出す</button>
          <button class="btn mana" type="button" data-act="mkhomfill" data-id="${k.id}" ${dz(() => { const c = mc(); return c === null || c === 0 || S.mana < c || S.homs.length >= MAX_HOMS; })}>不足分を生成して生み出す <small>${tx(() => { const c = mc(); return c === null ? '未登録の材料あり' : fmt(c); })}</small></button>
        </div>

    <p class="muted small">生み出した子は全員、採取のたびに経験値を得て育ちます。レベルが上がると、その子の成長率に従って能力値が伸びます。種類ごとに、能力値と技能はそれぞれ一番高い子のものが効きます。</p>
    <p class="muted small">周回すると「因果融合」が起き、種類ごとに全員が1人にまとまって、それぞれの一番良い能力値と技能が残ります。そのたびに能力の上限が15上がり、Lv1から育ち直します。</p></section>
  <div class="panel">
    <div class="small muted">ホムンクルスの効果（能力値1ごとに効果が2%ずつ掛け算で伸びます）</div>
    <div class="bonus">${effects}</div>
    <div class="row-between"><p class="small muted">技能: ${sk || 'なし'}</p><button class="btn" type="button" data-act="traithelp" aria-expanded="${!!ui.traitHelp}">${ui.traitHelp ? '技能の説明を閉じる' : '技能の説明'}</button></div>
    ${ui.traitHelp ? `<p class="small muted">技能のランクは E・D・C・B・A・S・S+ の7段階で、強さはそれぞれ ${RANK_V.join('・')} です。種類ごとに一番高いランクが効き、種類どうしは足し合わせます。Lv10とLv20になったとき、どれか1つのランクが上がります。</p>${TRAIT_IDS.map(id => { const tr = TRAITS[id]; const l = traitLv(id); return `<div class="item"><div class="top-row"><span class="nm">${tr.name}</span><span class="own small">${l ? `<b class="q">強さ${l}（${tr.now(l)}）</b>` : '<span class="muted">なし</span>'}</span></div><div class="meta">${esc(tr.d)}強さ1ごとに${tr.per}。</div></div>`; }).join('')}` : ''}

/* --- 迷宮 --- */
function vMaze() {
  const best = S.life.mazeBest || 0;
  const head = `<section class="area-head"><span class="eyebrow">ホムンクルスの迷宮　最深 地下${fmt(best)}階（マナ ${fmtX(mazeMult())}）</span><h2>迷宮</h2>

  const m = S.maze;
  if (!m) {
    const team = S.mazeTeam;
    const cards = S.homs.slice().sort((a, b) => statTotal(b) - statTotal(a)).map(h => {
      const on = team.includes(h.u);
      const c = cstat(h, S.homs.filter(x => team.includes(x.u)), 0);
      return `<div class="hom r${KIND[h.k].r}${on ? ' sel' : ''}">
        <div class="top-row"><span class="nm">${esc(KIND[h.k].name)}</span><span class="own small">Lv ${h.lv}${h.f ? `　融合${h.f}回` : ''}</span></div>
        <div class="mzst small"><span>HP <b>${fmt(c.maxhp)}</b></span><span>攻撃 <b>${fmt(c.atk)}</b></span><span>2回攻撃 ${Math.round(c.dbl * 100)}%</span><span>会心 ${Math.round(c.crit * 100)}%</span><span>回避 ${Math.round(c.dodge * 100)}%</span></div>
        ${skillTags(h)}
        <div class="acts"><button class="btn ${on ? 'okb' : ''}" type="button" data-act="mzpick" data-id="${h.u}" ${!on && team.length >= MAZE_TEAM ? 'disabled' : ''}>${on ? '連れていく（外す）' : team.length >= MAZE_TEAM ? 'もう連れていけない' : '連れていく'}</button></div>
      </div>`;
    }).join('');
    const last = S.mazeLast ? `<div class="panel"><div class="small muted">前回の探索</div>${S.mazeLast.map(l => `<p class="small">${esc(l)}</p>`).join('')}</div>` : '';
    return `${head}${last}
    <div class="panel"><div class="row-between"><span>連れていく子 ${team.length} / ${MAZE_TEAM}</span><button class="btn pri" type="button" data-act="mzstart" ${team.length ? '' : 'disabled'}>迷宮に入る</button></div>
    <p class="small muted">力と知恵が攻撃、力と器用がHP、速さが2回攻撃、運が会心、器用が回避に効きます。技能「豪腕」は攻撃、「修練」は経験値、「錬金」は報酬、「洞察」は分かれ道の先を見通す力になります。</p></div>
    <div class="list">${cards || '<p class="small muted">ホムンクルスがいません。相棒の画面で生み出してください。</p>'}</div>`;
  }
  const team = mzTeam();
  const bars = team.map(h => { const mx = cstat(h, team, m.buff).maxhp, hp = m.hp[h.u]; return `<div class="hpline${hp <= 0 ? ' down' : ''}"><span>${esc(KIND[h.k].name)} Lv${h.lv}</span><span class="hpbar"><i style="width:${Math.max(0, hp / mx * 100)}%"></i></span><span class="small">${hp <= 0 ? '戦闘不能' : fmt(hp) + '/' + fmt(mx)}</span></div>`; }).join('');
  const bagItems = Object.entries(m.bag.items).filter(([, n]) => n > 0).map(([id, n]) => `${ITEM[id].name}×${fmt(n)}`).join('、');
  const choices = m.choices.map((c, i) => {
    const p = PATHS[c.t];
    if (c.hide) return `<button class="path" type="button" data-act="mzgo" data-id="${i}"><b>？</b><span class="small muted">行ってみないとわからない</span></button>`;
    const foe = (c.t === 'foe' || c.t === 'elite' || c.t === 'boss') ? foeStats(m.floor, c.t) : null;

  }).join('');
  return `${head}
  <div class="panel mz">
    <div class="row-between"><h3>地下${fmt(m.floor)}階</h3><span class="small muted">${m.buff ? `祭壇の加護 攻撃+${m.buff * 15}%` : ''}</span></div>
    ${bars}

  </div>
  <div class="panel">${m.log.map(l => `<p class="small">${esc(l)}</p>`).join('')}</div>
  <h3>分かれ道</h3>
  <div class="paths">${choices}</div>
  <div class="acts">${confirmBtn('', 'data-act="mzback"', '帰還する（持ち物を持ち帰る）', 'もう一度タップで帰還')}</div>`;
}

/* --- ミッションと依頼 --- */

        ${confirmBtn('', `data-act="brute" data-id="${m.id}" ${dz(() => S.mana < m.brute)}`, `マナで押し通す <small>${fmt(m.brute)}</small>`, 'もう一度タップで確定')}
      </div>

  };

function vReq() {

    const m = ITEM[r.id];
    const mc = () => missingCost({ [r.id]: r.n }, 1);
    return `<div class="mis r${m.r}" ${cl(() => inv(r.id) >= r.n, 'ready')}>
      <div class="hd"><h3 class="rc">${esc(m.name)} を ${fmt(r.n)}個</h3><span class="rw">+${fmt(r.rw)} マナ・名声+1</span></div>
      <div class="prog"><i ${wd(() => Math.min(1, inv(r.id) / r.n) * 100)}></i></div>

function armed(btn) {
  if (btn.classList.contains('armed')) { btn.classList.remove('armed'); return true; }

}
main.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'garea': ui.gArea = id; if (S.unlocked[id]) S.area = id; break;
    case 'unlock': if (canUnlock(id)) unlock(id); break;
    case 'unlockBrute': { const u = AREA[id].unlock; if (S.mana < u.brute) break; if (!armed(b)) return; S.mana -= u.brute; unlock(id); break; }
    case 'disarea': dissolveIds(rawOf(id).map(i => i.id)); break;
    case 'labview': ui.labView = id; break;
    case 'labarea': ui.labArea = id; break;
    case 'dislist': dissolveIds(labIds()); break;
    case 'dis': { const c = inv(id); const g = dissolve(id, c); S.inv[id] = 0; if (g > 0) toast(`${ITEM[id].name}を${fmt(c)}個分解: +${fmt(g)} マナ`); break; }
    case 'force': { const c = unitMana(id) * 10; if (S.mana < c) break; if (!armed(b)) return; S.mana -= c; addItem(id, 1); toast(`強制錬成で${ITEM[id].name}が生まれた`); break; }
    case 'unlockcraft': { const p = ITEM[id]; if (procOn(p)) break; if (canMake(p.in) < 1 && !fillMissing(p.in, 1)) break; if (craft(p, 1)) { toast(`${p.name}を解放しました。これからは不足分を生成で作れます`, 4000); } break; }
    case 'mkhom': { const h = makeHom(KIND[id]); if (h) homToast(h); break; }
    case 'mkhomfill': { if (S.homs.length >= MAX_HOMS) break; if (fillMissing(KIND[id].in, 1)) { const h = makeHom(KIND[id]); if (h) homToast(h); } break; }
    case 'release': { if (!armed(b)) return; const u = Number(id); const g = releaseHom(u); toast(`ホムンクルスと別れました: +${fmt(g)} マナ`); break; }
    case 'traithelp': ui.traitHelp = !ui.traitHelp; break;
    case 'mzpick': { const u = Number(id); if (S.mazeTeam.includes(u)) S.mazeTeam = S.mazeTeam.filter(x => x !== u); else if (S.mazeTeam.length < MAZE_TEAM) S.mazeTeam.push(u); break; }
    case 'mzstart': mzStart(); break;
    case 'mzgo': mzGo(Number(id)); break;
    case 'mzback': if (!armed(b)) return; mzReturn(false); break;
    case 'misview': ui.misView = id; break;
    case 'misarea': ui.misArea = id; break;
    case 'claim': { const m = MISS[id]; if (!m || !misOpen(m) || !ready(m)) break; if (m.deliver) S.inv[m.deliver] -= m.goal; complete(m); break; }
    case 'claimfill': { const m = MISS[id]; if (!m || !misOpen(m)) break; fillMissing({ [m.deliver]: m.goal }, 1); break; }
    case 'brute': { const m = MISS[id]; if (!m || !misOpen(m) || S.mana < m.brute) break; if (!armed(b)) return; S.mana -= m.brute; complete(m, 'マナで押し通した'); break; }
    case 'req': deliverReq(Number(id)); break;
    case 'reqfill': { const r = S.reqs[Number(id)]; if (r && !r.wait && fillMissing({ [r.id]: r.n }, 1)) deliverReq(Number(id)); break; }
    case 'reqskip': S.reqs[Number(id)] = { wait: Date.now() + 30000 }; break;
    case 'buy': buy(id); break;
    case 'upview': ui.upView = id; break;
    case 'bookview': ui.bookView = id; break;
    case 'buypu': if (buyPu(id)) toast(`「${PU[id].name}」を習得しました`); break;
    case 'prestige': { if (!armed(b)) return; const g = prestige(); if (g) { setTabs(); checkJournal(); toast(`賢者の石を錬成しました（+${g}個）。${S.run}周目のはじまりです`, 5000); window.scrollTo(0, 0); } break; }
    case 'buymax': { let n = 0; while (n < 1000 && buy(id)) n++; if (n > 1) toast(`${UP[id].name}を${n}レベル上げました`); break; }
  }
  update();
});

const LS = 'addall.save.v1';
let cloudRef = null, cloudBusy = false, lastCloud = 0, cloudStatus = '確認中';
let bootSavedAt = 0;
const hhmm = t => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function lsLoad() { try { const s = localStorage.getItem(LS); return s ? JSON.parse(s) : null; } catch { return null; } }
function lsSave() {
  try { localStorage.setItem(LS, JSON.stringify(S)); document.getElementById('lsStatus').textContent = '保存済み ' + hhmm(Date.now()); }
  catch { document.getElementById('lsStatus').textContent = 'このブラウザでは保存できません'; }
}
function saveLocal() { S.savedAt = Date.now(); lsSave(); }
function setCloudStatus(s) { cloudStatus = s; document.getElementById('cloudStatus').textContent = s; }
async function cloudSave(force) {
  if (!cloudRef || cloudBusy) return;
  if (!force && Date.now() - lastCloud < 30000) return;
  if (force && Date.now() - lastCloud < 3000) return;
  cloudBusy = true;
  S.savedAt = Date.now();
  try {
    await cloudRef.set({ json: JSON.stringify(S), savedAt: S.savedAt });
    lastCloud = Date.now();
    setCloudStatus('保存済み ' + hhmm(lastCloud));
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { cloudRef = null; setCloudStatus('この表示では保存できません'); }
    else setCloudStatus('保存に失敗しました（あとで再試行）');
  }
  cloudBusy = false;
}
function migrateOpen() { if (S._migrateOpen) { delete S._migrateOpen; checkFeats(true); } }
function adopt(obj, withOffline) {
  S = normalize(obj);
  migrateOpen();
  ui.gArea = S.area; ui.misArea = S.area; ui.fuse = null;
  if (withOffline && S.savedAt) { const sec = (Date.now() - S.savedAt) / 1000; if (sec > 10) offline(sec); }
  lastTick = Date.now();
  refreshReqs();
  setTabs();
  render();
}
async function cloudInit() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { setCloudStatus('このページの外では使えません'); return; }
  const timer = setTimeout(() => { if (!cloudRef) setCloudStatus('接続できませんでした'); }, 12000);
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { clearTimeout(timer); setCloudStatus('使えません（ブラウザ内にだけ保存）'); return; }
    const uid = await user.id();
    if (!uid) { clearTimeout(timer); setCloudStatus('ログインすると使えます'); return; }
    const ref = db.doc('data/users/' + uid + '/save');
    const snap = await ref.get();
    clearTimeout(timer);
    if (snap.exists) {
      const d = snap.data();
      if (d && typeof d.json === 'string' && Number(d.savedAt) > bootSavedAt + 1000) {
        try { adopt(JSON.parse(d.json), true); toast('claude.aiのセーブデータを読み込みました'); } catch {}
      }
    }
    cloudRef = ref;
    setCloudStatus('接続済み');
    cloudSave(true);
  } catch (e) {
    clearTimeout(timer);
    setCloudStatus('接続できませんでした');
  }
}

let lastTick = Date.now();
const acc = {};
let frame = 0;
function tick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt > 5) { offline(dt); }
  else {
    for (const a of unlockedAreas()) {
      const r = famRate(a.id);
      if (r <= 0) continue;
      acc[a.id] = (acc[a.id] || 0) + r * dt;
      if (acc[a.id] >= 1) { const k = Math.floor(acc[a.id]); acc[a.id] -= k; autoTaps(k, a.id); }
    }
  }
  if (frame % 5 === 0 || dt > 5) processAuto();
  if (frame % 10 === 0) { refreshReqs(); checkJournal(); }
  if (frame % 3 === 0) checkFeats(false);
  if (++frame % 2 === 0 || dt > 5) update();
}

function start(data) {
  if (data && data.state) {
    S = normalize(data.state);
    if (data.ui) Object.assign(ui, data.ui);
  } else {
    const ls = lsLoad();
    if (ls) S = normalize(ls);
    ui.gArea = S.area; ui.misArea = S.area;
  }
  bootSavedAt = S.savedAt || 0;
  migrateOpen();
  setTabs();
  refreshReqs();
  render();
  if (!(data && data.state) && S.savedAt) { const sec = (Date.now() - S.savedAt) / 1000; if (sec > 10) { offline(sec); update(); } }
  lastTick = Date.now();
  setInterval(tick, 100);
  setInterval(() => { saveLocal(); cloudSave(false); }, 5000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { saveLocal(); cloudSave(true); }
    else { tick(); }
  });
  window.addEventListener('pagehide', () => { saveLocal(); });
  cloudInit();
}

try { window.claude?.hot?.snapshot?.(() => ({ state: S, ui })); } catch {}
const hot = window.claude?.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start(hot?.data ?? {});
})();
</script>
