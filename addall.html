<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 工房の帳面: 上に残高（マナ）、中央に作業台、下にタブ。片手の親指で全部届く縦長レイアウト。 */
:root {
  --bg: #edf1ef;
  --surface: #ffffff;
  --surface2: #e2e8e5;
  --ink: #1c2725;
  --muted: #5b6a66;
  --line: #cfd8d4;
  --brass: #8a5d17;
  --brass-soft: #f2e4c9;
  --mana: #3d4fc4;
  --mana-soft: #dde2fa;
  --ok: #26754d;
  --ok-soft: #d6eee0;
  --bad: #b0402c;
  --r0: #77827f;
  --r1: #4c7c37;
  --r2: #2c70a4;
  --r3: #7a4cbd;
  --r4: #a8740a;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111918; --surface: #1a2422; --surface2: #23302d; --ink: #e5ece9; --muted: #95a5a1; --line: #2f3d3a;
    --brass: #d9a94f; --brass-soft: #3a2f1a; --mana: #9eabff; --mana-soft: #262c52; --ok: #6fcf9b; --ok-soft: #1c3a2a; --bad: #ff8f78;
    --r0: #9aa6a3; --r1: #8cc46f; --r2: #6fb5ea; --r3: #b893f2; --r4: #f0bf4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111918; --surface: #1a2422; --surface2: #23302d; --ink: #e5ece9; --muted: #95a5a1; --line: #2f3d3a;
  --brass: #d9a94f; --brass-soft: #3a2f1a; --mana: #9eabff; --mana-soft: #262c52; --ok: #6fcf9b; --ok-soft: #1c3a2a; --bad: #ff8f78;
  --r0: #9aa6a3; --r1: #8cc46f; --r2: #6fb5ea; --r3: #b893f2; --r4: #f0bf4c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--mana); outline-offset: 2px; }

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 上部: 残高 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding-block: 10px;
}
.brand { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .04em; color: var(--brass); }
.bal { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.bal .lab { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.bal b { font-size: 24px; font-weight: 700; color: var(--mana); white-space: nowrap; }
.bal small { font-size: 12px; color: var(--muted); min-height: 1em; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

main { padding-block: 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px); max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 17px; margin: 0; }
h4 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 6px 0 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.lack { color: var(--bad); }

/* 下部: タブ */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
}
.tabs button {
  height: var(--nav-h); border: 0; background: none; cursor: pointer; position: relative; min-width: 0;
  font-size: 11px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; white-space: nowrap;
}
.tabs button .k { font-family: var(--f-display); font-size: 19px; font-weight: 800; line-height: 1; }
.tabs button[aria-selected="true"] { color: var(--brass); }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brass); }
.badge { position: absolute; top: 6px; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--ok); color: var(--surface); font-size: 11px; font-weight: 700; line-height: 18px; }

/* 共通部品 */
.btn {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 10px;
  min-height: 40px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.25; text-align: center;
}
.btn.pri { background: var(--brass); border-color: var(--brass); color: var(--surface); font-weight: 700; }
.btn.mana { background: var(--mana-soft); border-color: transparent; color: var(--mana); font-weight: 700; }
.btn.okb { background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 700; }
.btn:disabled { opacity: .42; cursor: default; }
.btn small { font-weight: 400; font-size: 12px; opacity: .9; }
.btn .cf { display: none; }
.btn.armed .lbl { display: none; }
.btn.armed .cf { display: inline; }
.btn.armed { background: var(--brass-soft); color: var(--brass); border-color: var(--brass); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts .btn { flex: 1 1 120px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 100%; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; min-height: 36px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass-soft); color: var(--brass); font-weight: 700; }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.chip.locked { color: var(--muted); border-style: dashed; }
.r0 { --rc: var(--r0); } .r1 { --rc: var(--r1); } .r2 { --rc: var(--r2); } .r3 { --rc: var(--r3); } .r4 { --rc: var(--r4); }
.rc { color: var(--rc); }
.prog { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--brass); border-radius: 4px; transition: width .2s; }
.q { font-size: 12px; font-weight: 700; color: var(--brass); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; border-radius: 6px; padding: 1px 8px; background: var(--mana-soft); color: var(--mana); white-space: nowrap; }
.tag.none { background: var(--surface2); color: var(--muted); }

/* 採取 */
.area-head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.tapzone { position: relative; display: grid; place-items: center; padding-block: 8px; overflow: hidden; border-radius: 16px; }
.tap {
  width: min(62vw, 230px); max-width: 100%; aspect-ratio: 1; border-radius: 50%;
  border: 2px solid var(--brass); cursor: pointer; user-select: none; -webkit-user-select: none;
  background: radial-gradient(circle at 50% 38%, var(--mana-soft) 0%, var(--surface) 68%);
  box-shadow: inset 0 0 0 9px var(--surface), inset 0 0 0 10px var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .07s ease-out;
}
.tap b { font-family: var(--f-display); font-size: 26px; font-weight: 800; }
.tap small { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.tap.hit { transform: scale(.955); }
.pt { position: absolute; pointer-events: none; font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--rc); text-shadow: 0 1px 0 var(--bg); animation: rise .95s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -64px); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .lab { font-size: 12px; color: var(--muted); }
.stat b { font-size: 18px; overflow-wrap: anywhere; line-height: 1.25; }
.stat small { font-size: 11px; color: var(--muted); }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--brass); flex: none; }

/* 一覧の行（素材・レシピ・道具） */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.item .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.item .nm { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.item .meta { font-size: 12px; color: var(--muted); }
.item .own { font-size: 13px; white-space: nowrap; }
.item .own b { font-size: 16px; }
.item.unknown .nm { color: var(--muted); letter-spacing: .1em; }
.item.sel { box-shadow: 0 0 0 2px var(--mana) inset; }
.ins { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; }

/* 道具 */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slot .lab { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.slot b { font-family: var(--f-display); font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.slot .eff { font-size: 13px; color: var(--brass); font-weight: 700; }

/* 図鑑 */
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .no { font-size: 11px; color: var(--muted); letter-spacing: .1em; display: flex; justify-content: space-between; gap: 6px; }
.card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
.card .num { font-size: 12px; color: var(--muted); margin-top: auto; }
.card.unknown { background: var(--surface2); border-top-color: var(--line); }
.card.unknown h3 { color: var(--muted); letter-spacing: .15em; }

/* ミッション */
.bonus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13px; }
.bonus b { color: var(--brass); }
.mis { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.mis .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rw { font-size: 12px; font-weight: 700; color: var(--brass); background: var(--brass-soft); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.mis .tx { font-size: 14px; color: var(--muted); }
.mis .pv { font-size: 12px; color: var(--muted); text-align: right; }
.mis.ready { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
.mis.done { background: var(--surface2); padding-block: 8px; flex-direction: row; justify-content: space-between; align-items: center; gap: 8px; }
.mis.done .nm { color: var(--muted); }
.mis.done .ck { color: var(--ok); font-weight: 700; font-size: 13px; white-space: nowrap; }

/* 強化 */
.up { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.up .lv { font-size: 13px; color: var(--muted); }
.up .eff { font-size: 14px; }
.up .eff b { color: var(--brass); }
.up .acts .btn:first-child { flex: 2 1 160px; }

/* 設定シート */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px; font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; word-break: break-all; }

/* 通知 */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 14px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgb(0 0 0 / .2); animation: tin .2s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .pt { animation-duration: .01s; }
  .tap { transition: none; }
  .toast { animation: none; }
}
</style>

<header class="top gut">
  <div class="brand">AddAll</div>
  <div class="bal" aria-live="off">
    <span class="lab">マナ</span>
    <b id="hMana">0</b>
    <small id="hRate"></small>
  </div>
  <button class="icon-btn" id="gear" type="button" aria-label="設定とセーブ">

  </button>
</header>

<main id="main" class="gut"></main>

<nav class="tabs gut" role="tablist" aria-label="画面の切り替え">

  <button type="button" role="tab" data-tab="lab" aria-selected="false"><span class="k">工</span>工房</button>

</nav>

      <div class="row-between"><span>ブラウザ内</span><span class="muted small" id="lsStatus">-</span></div>

<script>
(() => {
'use strict';

/* ===================== データ ===================== */
const RARITY = ['ありふれた', '普通', '珍しい', '希少', '伝説'];
const W10 = [100, 60, 45, 25, 12, 7, 3.5, 1.4, 0.5, 0.15];
const R10 = [0, 0, 0, 1, 1, 2, 2, 3, 3, 4];
// 採取地での採取回数（探索）がこの数に届くと、その素材が出るようになる
const DEPTH = [0, 0, 0, 30, 80, 200, 500, 1200, 3000, 8000];

const AREAS = [
  { id: 'a1', name: '工房の裏山', desc: '工房の裏に広がる小さな山。ありふれた素材ばかりだが、まれに珍しいものが見つかる。' },
  { id: 'a2', name: '霧の森', desc: '一年中霧が晴れない森。木々の奥から、ときどき光の粒が漂ってくる。', unlock: { area: 'a1', n: 8, brute: 5e5 } },
  { id: 'a3', name: '水晶の洞窟', desc: '壁一面に水晶が生えた洞窟。奥へ進むほど、石の値打ちが跳ね上がる。', unlock: { area: 'a2', n: 6, brute: 1e11 } },
];
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));

const RAW = {
  a1: [
    ['stone', '小石', 1, 'どこにでもある石ころ。分解すると、ほんのわずかなマナがにじみ出る。'],
    ['twig', '枯れ枝', 2, '乾いた小枝。炉にくべる燃料としても使える。'],
    ['weed', '雑草', 3, '抜いても抜いても生えてくる。しぶとさだけなら一級品。'],
    ['clay', '粘土', 6, '沢沿いで採れる灰色の土。こねて焼けば煉瓦になる。'],
    ['copper', '銅鉱石', 15, '緑の筋が走る石。錬金術師が最初に覚える金属。'],
    ['herb', '薬草', 30, '傷に効く苦い葉。煎じた汁にもマナが溶けている。'],
    ['iron', '鉄鉱石', 70, 'ずしりと重い赤茶色の石。分解炉の扉もこれでできている。'],

  const chips = list.map(a => `<button type="button" class="chip${S.unlocked[a.id] ? '' : ' locked'}" data-act="${act}" data-id="${a.id}" aria-pressed="${a.id === cur}">${S.unlocked[a.id] ? '' : '未解放　'}${esc(a.name)}</button>`);
  if (opts.extra) chips.push(...opts.extra);
  return `<div class="chips">${chips.join('')}</div>`;
}

/* --- 採取 --- */
function vGather() {
  const a = AREA[ui.gArea];
  const chips = areaChips(ui.gArea, 'garea', { showNext: true });
  if (!S.unlocked[a.id]) {
    const u = a.unlock;
    return `${chips}
    <section class="area-head"><span class="eyebrow">採取地 ${AREAS.indexOf(a) + 1}（未解放）</span><h2>${esc(a.name)}</h2><p class="muted small">${esc(a.desc)}</p></section>
    <div class="panel">
      <h3>解放の条件</h3>
      <p>${esc(AREA[u.area].name)}のミッションを${u.n}個達成する</p>
      <div class="prog"><i ${wd(() => Math.min(1, missionDoneIn(u.area) / u.n) * 100)}></i></div>
      <p class="small muted">${tx(() => Math.min(missionDoneIn(u.area), u.n))} / ${u.n}</p>
      <div class="acts">
        <button class="btn okb" type="button" data-act="unlock" data-id="${a.id}" ${dz(() => !canUnlock(a.id))}>解放する</button>
        ${confirmBtn('', `data-act="unlockBrute" data-id="${a.id}" ${dz(() => S.mana < u.brute)}`, `マナで押し通す <small>${fmt(u.brute)}</small>`, 'もう一度タップで確定')}
      </div>
    </div>`;
  }
  const raws = rawOf(a.id).map(i => i.id);
  const bagCount = () => raws.reduce((s, id) => s + inv(id), 0);
  const bagValue = () => raws.reduce((s, id) => s + inv(id) * unitMana(id), 0);
  const here = S.area === a.id;
  return `${chips}
  <section class="area-head"><span class="eyebrow">採取地 ${AREAS.indexOf(a) + 1}</span><h2>${esc(a.name)}</h2><p class="muted small">${esc(a.desc)}</p></section>
  <div class="tapzone" id="tapzone">
    <button class="tap" id="tap" type="button" aria-label="採取する"><b>採取</b><small>タップ</small></button>
  </div>
  ${here ? '' : ''}
  <div class="stats">
    <div class="stat"><span class="lab">採取力</span><b>${tx(() => fmtD(power()))}</b><small>個 / 1回</small></div>
    <div class="stat"><span class="lab">熟練</span><b>${tx(() => fmt(S.skill))}</b><small>${tx(() => '採取力 ' + fmtX(skillMult()))}</small></div>
    <div class="stat"><span class="lab">ここの使い魔</span><b>${tx(() => fmtD(famRate(a.id)))}</b><small>回 / 秒（Lv ${tx(() => fmt(famLv(a.id)))}）</small></div>
  </div>
  <div class="panel">
    <div class="row-between"><span class="small">この採取地の図鑑</span><b>${tx(() => areaReg(a.id))} / 10</b></div>
    <div class="row-between small"><span>探索 ${tx(() => fmt(depthOf(a.id)))} 回</span><span class="muted">${tx(() => { const n = nextDepth(a.id); return n === null ? 'すべての素材が出るようになりました' : `次の発見まで あと ${fmt(n - depthOf(a.id))} 回`; })}</span></div>
    <div class="tags">${rawOf(a.id).map(i => `<span class="tag${S.reg[i.id] ? '' : ' none'}" ${cl(() => !S.reg[i.id], 'none')}>${tx(() => S.reg[i.id] ? i.name : '？？？')}</span>`).join('')}</div>
  </div>
  <div class="panel">
    <div class="row-between">
      <div><div class="small muted">ここの素材の手持ち</div><b>${tx(() => fmt(bagCount()))}</b> 個 <span class="small muted">（分解すると ${tx(() => fmt(bagValue()))} マナ）</span></div>
      <button class="btn pri" type="button" data-act="disarea" data-id="${a.id}" ${dz(() => bagCount() === 0)}>すべて分解</button>
    </div>
    ${S.up.autodis ? `<label class="switch"><input type="checkbox" id="autodis" ${S.autoDis ? 'checked' : ''}> 自動分解（素材と自動加工の加工品をマナにする。自動加工の材料は残す。道具や依頼の材料をためたいときはオフに）</label>`
      : `<p class="small muted">強化の「自動分解装置」を設置すると、採取した素材を自動でマナにできます。</p>`}
  </div>
  <p class="small muted">採取するたびに、その採取地の探索が進みます（使い魔の分も含む）。珍しい素材は、探索が進むと出るようになります。</p>
  <p class="small muted">タップするたびに熟練が増えます。熟練に上限はなく、増えるほど採取力が上がります。使い魔は採取地ごとに雇い（強化画面）、それぞれの採取地で同時に働きます。</p>`;
}
let tapHitTimer = 0;
function bindTap() {
  const t = document.getElementById('tap');
  const z = document.getElementById('tapzone');
  if (!t) return;
  const go = (x, y) => {
    S.area = ui.gArea;
    S.st.manual++;
    S.st.areaTaps[S.area] = (S.st.areaTaps[S.area] || 0) + 1;
    S.skill += skillGain();
    const got = gather(power());
    t.classList.add('hit');
    clearTimeout(tapHitTimer);
    tapHitTimer = setTimeout(() => t.classList.remove('hit'), 70);
    const zr = z.getBoundingClientRect();
    const ids = Object.keys(got).sort((a, b) => ITEM[b].v - ITEM[a].v).slice(0, 2);
    ids.forEach((id, k) => {
      if (z.querySelectorAll('.pt').length > 10) return;
      const p = document.createElement('div');
      const m = ITEM[id];
      p.className = 'pt r' + m.r;
      p.textContent = `+${fmt(got[id])} ${m.name}`;
      p.style.left = Math.min(Math.max(x - zr.left + (Math.random() * 40 - 20), 70), zr.width - 70) + 'px';
      p.style.top = (y - zr.top - 24 - k * 22) + 'px';
      z.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    });
    update();
  };
  t.addEventListener('pointerdown', e => { e.preventDefault(); go(e.clientX, e.clientY); });
  t.addEventListener('click', e => {
    if (e.detail !== 0) return; // キーボード操作のときだけ
    const r = t.getBoundingClientRect();
    go(r.left + r.width / 2, r.top + r.height / 2);
  });
}

/* --- 工房 --- */
function labIds() {
  if (ui.labArea === 'proc') return PROC.filter(p => S.unlocked[p.area]).map(p => p.id);
  return rawOf(ui.labArea).map(i => i.id);
}
function vLab() {
  const seg = [['dg', '分解'], ['craft', '加工'], ['refine', '精錬']]
    .map(([k, n]) => `<button type="button" data-act="labview" data-id="${k}" aria-pressed="${ui.labView === k}">${n}</button>`).join('');
  let body = '';
  if (ui.labView === 'dg') body = vLabDG();
  else if (ui.labView === 'craft') body = vLabCraft();
  else body = vLabRefine();
  return `<div class="seg full" role="group" aria-label="工房の作業">${seg}</div>${body}`;
}
function labChips() {
  if (ui.labArea !== 'proc' && !S.unlocked[ui.labArea]) ui.labArea = 'a1';
  return areaChips(ui.labArea, 'labarea', { extra: [`<button type="button" class="chip" data-act="labarea" data-id="proc" aria-pressed="${ui.labArea === 'proc'}">加工品</button>`] });
}
function vLabDG() {
  const ids = labIds();
  const rows = ids.map(id => {
    const m = ITEM[id];
    if (S.reg[id]) {
      return `<div class="item r${m.r}">
        <div class="top-row"><span class="nm">${esc(m.name)}</span><span class="own">所持 <b>${tx(() => fmt(inv(id)))}</b></span></div>
        <div class="meta">価値 ${tx(() => fmt(unitMana(id)))} マナ　品質 ${tx(() => fmtQ(qOf(id)))}</div>
        <div class="acts">
          <button class="btn" type="button" data-act="dis" data-id="${id}" ${dz(() => inv(id) === 0)}>分解 <small>+${tx(() => fmt(inv(id) * unitMana(id)))}</small></button>
        </div>
      </div>`;
    }
    const fc = () => unitMana(id) * 10;
    return `<div class="item unknown r${m.r}">
      <div class="top-row"><span class="nm">？？？</span></div>
      <div class="meta">${m.kind === 'proc' ? 'まだ作ったことのない加工品' : 'まだ見つけていない素材'}</div>
      <div class="acts">${confirmBtn('', `data-act="force" data-id="${id}" ${dz(() => S.mana < fc())}`, `強制錬成 <small>${tx(() => fmt(fc()))}</small>`, 'もう一度タップで錬成')}</div>
    </div>`;
  }).join('');
  return `${labChips()}
  <p class="muted small">分解するとマナになります。足りない材料は、加工・道具の作成・精錬・納品のときにマナで生成できます。「？？？」はまだ見つけていないもので、10倍のマナを払えば1つ強制錬成できます。</p>
  <div class="row-between">
    <span class="small muted">表示中の手持ち ${tx(() => fmt(ids.reduce((s, id) => s + inv(id) * unitMana(id), 0)))} マナぶん</span>
    <button class="btn pri" type="button" data-act="dislist" ${dz(() => ids.every(id => inv(id) === 0))}>表示中を全部分解</button>
  </div>
  <div class="list">${rows}</div>`;
}
function insHtml(ins, times = 1) {
  return `<div class="ins">${Object.entries(ins).map(([id, n]) =>
    `<span ${cl(() => inv(id) < n * times, 'lack')}>${esc(nameOf(id))} ${tx(() => fmt(inv(id)))}/${fmt(n * times)}</span>`).join('')}</div>`;
}
function vLabCraft() {
  const avail = PROC.filter(p => S.unlocked[p.area]);
  const made = avail.filter(procOn).length;
  const groups = unlockedAreas().map(a => {
    const rows = PROC.filter(p => p.area === a.id).map(p => {
      if (procOn(p)) {
        return `<div class="item r${p.r}">
          <div class="top-row"><span class="nm">${esc(p.name)} <span class="tag">自動で加工中</span></span><span class="own">所持 <b>${tx(() => fmt(inv(p.id)))}</b></span></div>
          <div class="meta">価値 ${tx(() => fmt(unitMana(p.id)))} マナ　加工した数 ${tx(() => fmt(S.st.crafted[p.id] || 0))}</div>
          ${insHtml(p.in, 1)}
        </div>`;
      }
      const mc = () => missingCost(p.in, 1);
      return `<div class="item r${p.r}">
        <div class="top-row"><span class="nm">${esc(p.name)} <span class="tag none">未解放</span></span></div>
        <div class="meta">価値 ${tx(() => fmt(unitMana(p.id)))} マナ（材料の合計の約1.5倍）</div>
        ${insHtml(p.in, 1)}
        <div class="acts">
          <button class="btn pri" type="button" data-act="unlockcraft" data-id="${p.id}" ${dz(() => { if (canMake(p.in) >= 1) return false; const c = mc(); return c === null || S.mana < c; })}>加工して解放 <small>${tx(() => { if (canMake(p.in) >= 1) return '手持ちで足ります'; const c = mc(); return c === null ? '未登録の材料あり' : '不足分 ' + fmt(c) + ' マナ'; })}</small></button>
        </div>
      </div>`;
    }).join('');
    return `<h4>${esc(a.name)}のレシピ</h4>${rows}`;
  }).join('');
  return `<div class="panel"><div class="row-between"><span>解放した加工品</span><b>${made} / ${avail.length}</b></div><div class="prog"><i style="width:${avail.length ? made / avail.length * 100 : 0}%"></i></div></div>
  <p class="muted small">一度加工すると解放され、それからは材料がそろうたびに自動で加工されます。加工品は材料の合計より価値が高いので、そのまま分解するより多くのマナになります。自動分解がオンのときも、解放したレシピの材料は分解されずに残ります。</p>
  <div class="list">${groups}</div>`;
}
function vLabRefine() {
  const ids = labIds().filter(id => S.reg[id]);
  const rows = ids.map(id => {
    const m = ITEM[id];
    if (perfect(id)) {
      return `<div class="item r${m.r}">
        <div class="top-row"><span class="nm">${esc(m.name)}</span><span class="q">完璧</span></div>
        <div class="prog"><i style="width:100%"></i></div>
        <div class="meta">品質 100%　価値 ×2.50（完璧のおまけ込み）</div>
      </div>`;
    }
    return `<div class="item r${m.r}">
      <div class="top-row"><span class="nm">${esc(m.name)}</span><span class="own">所持 <b>${tx(() => fmt(inv(id)))}</b></span></div>
      <div class="prog"><i ${wd(() => qOf(id) * 100)}></i></div>
      <div class="meta">品質 <b class="q">${tx(() => fmtQ(qOf(id)))}</b> → ${tx(() => fmtQ((refSteps(id) + 1) / REF_MAX))}　価値 ${tx(() => fmtX(valMult(id)))}${tx(() => refSteps(id) === REF_MAX - 1 ? ' → 完璧で ×2.50' : '')}</div>
      <div class="meta">必要 ${tx(() => fmt(refineCost(id)))}個　${tx(() => { const l = refineLack(id); return l > 0 ? `不足分は ${fmt(l)} マナで生成` : '手持ちで足ります'; })}</div>
      <div class="acts">
        <button class="btn pri" type="button" data-act="refine" data-id="${id}" ${dz(() => S.mana < refineLack(id))}>精錬</button>
        ${confirmBtn('', `data-act="refinemax" data-id="${id}" ${dz(() => S.mana < refineLack(id))}`, '完璧まで精錬 <small>マナも使う</small>', 'もう一度タップで実行')}
      </div>
    </div>`;
  }).join('');
  return `${labChips()}
  <p class="muted small">同じ素材をまとめて使い、その素材の品質を上げます。20段階あり、1段階ごとに品質が5%、価値も5%上がります。100%で「完璧」になり、価値が2.5倍になります。品質の高い素材で作った道具は、品質が高くなりやすくなります。手持ちが足りないときは、不足分をマナで生成して精錬します。</p>
  <div class="list">${rows || '<p class="muted small">図鑑に登録した素材だけ精錬できます。</p>'}</div>`;
}

/* --- 道具 --- */
const traitTags = t => {
  const e = Object.entries(t.t);
  return `<div class="tags">${e.length ? e.map(([id, lv]) => `<span class="tag">${TRAITS[id].name} Lv${lv}</span>`).join('') : '<span class="tag none">特性なし</span>'}</div>`;
};
const traitText = t => Object.entries(t.t).map(([id, lv]) => `${TRAITS[id].name} Lv${lv}（${TRAITS[id].fx}×${lv}）`).join('、');
function vTools() {
  const slots = SLOTS.map(s => {
    const t = toolById(S.eq[s.id]);
    if (!t) return `<div class="slot"><span class="lab">${s.name}（${s.stat}）</span><b class="muted">なし</b></div>`;
    const tr = TOOL[t.b];
    return `<div class="slot r${tr.r}"><span class="lab">${s.name}（${s.stat}）</span><b>${esc(tr.name)}</b><span class="eff">${fmtX(toolEff(t))}</span><span class="q">品質 ${fmtQ(t.q)}</span></div>`;
  }).join('');
  const tl = TRAIT_IDS.filter(id => traitLv(id) > 0).map(id => `${TRAITS[id].name} Lv${traitLv(id)}`).join('、');

  let fusePanel = '';
  const fa = ui.fuse != null ? toolById(ui.fuse) : null;
  if (ui.fuse != null && !fa) ui.fuse = null;
  if (fa) {
    const slot = TOOL[fa.b].slot;
    const cands = S.tools.filter(t => t !== fa && TOOL[t.b].slot === slot && S.eq[slot] !== t.u)
      .sort((x, y) => (y.b === fa.b) - (x.b === fa.b) || traitSum(y) - traitSum(x));
    const bc = () => missingCost(TOOL[fa.b].in, 10);
    const rows = cands.map(c => {
      const r = fuseResult(fa, c);
      const tags = Object.entries(r.t).map(([id, lv]) => `<span class="tag">${TRAITS[id].name} Lv${lv}</span>`).join('') || '<span class="tag none">特性なし</span>';
      return `<div class="item r${TOOL[c.b].r}">
        <div class="top-row"><span class="nm">${esc(TOOL[c.b].name)}</span><span class="own small muted">${c.b === fa.b ? '同じ種類' : '特性だけ受け継ぐ'}</span></div>
        <div class="meta">品質 ${fmtQ(c.q)}</div>
        ${traitTags(c)}
        <div class="meta">融合すると → 品質 <b class="q">${fmtQ(r.q)}</b>、効果 ${fmtX(toolEff({ b: fa.b, q: r.q }))}、特性は次のとおり</div>
        <div class="tags">${tags}</div>
        <div class="acts">${confirmBtn('pri', `data-act="fuse" data-id="${c.u}"`, 'この道具と融合する', 'もう一度タップで融合')}</div>
      </div>`;
    }).join('');
    fusePanel = `<div class="panel" style="border-color:var(--mana)">
      <div class="row-between"><h3>融合: ${esc(TOOL[fa.b].name)}</h3><button class="btn" type="button" data-act="fusecancel">やめる</button></div>
      <p class="small">いまの品質 <b class="q">${fmtQ(fa.q)}</b>、効果 ${fmtX(toolEff(fa))}</p>
      ${traitTags(fa)}
      <p class="small muted">同じ枠の道具を1つ消費して、特性を受け継ぎます。両方にある特性はレベルを足し合わせ、上限はありません。同じ種類の道具なら品質も上がります。特性は全${TRAIT_IDS.length}種類すべて持て、融合で消えることはありません。装備中の道具は素材にできません。</p>
      <div class="acts">
        <button class="btn mana" type="button" data-act="bulkfuse" data-id="1" ${dz(() => { const c = missingCost(TOOL[fa.b].in, 1); return c === null || S.mana < c || S.tools.length >= MAX_TOOLS; })}>強化合成 ×1 <small>${tx(() => { const c = missingCost(TOOL[fa.b].in, 1); return c === null ? '未登録の材料あり' : fmt(c); })}</small></button>
        ${confirmBtn('mana', `data-act="bulkfuse" data-id="10" ${dz(() => { const c = bc(); return c === null || S.mana < c || S.tools.length >= MAX_TOOLS; })}`, `まとめて強化合成 ×10 <small>${tx(() => { const c = bc(); return c === null ? '未登録の材料あり' : '約' + fmt(c); })}</small>`, 'もう一度タップで実行')}
      </div>
      <p class="small muted">強化合成: 同じ種類の道具を作って（足りない材料はマナで生成）すぐ融合します。</p>
      <h4>持っている道具から選ぶ</h4>
      <div class="list">${rows || '<p class="small muted">同じ枠の道具がほかにありません。強化合成を使うか、下の「作成」で作ってください。</p>'}</div>
    </div>`;
  }

  const recipes = unlockedAreas().map(a => {
    const rows = TOOLR.filter(r => r.area === a.id).map(r => {
      const mc = () => missingCost(r.in, 1);
      return `<div class="item r${r.r}">
        <div class="top-row"><span class="nm">${esc(r.name)}</span><span class="own small muted">${SLOT[r.slot].name}・${SLOT[r.slot].stat} 基本${fmtX(r.base)}</span></div>
        ${insHtml(r.in, 1)}
        <div class="acts">
          <button class="btn pri" type="button" data-act="mktool" data-id="${r.id}" ${dz(() => canMake(r.in) < 1 || S.tools.length >= MAX_TOOLS)}>作成</button>
          <button class="btn mana" type="button" data-act="mktoolfill" data-id="${r.id}" ${dz(() => { const c = mc(); return c === null || c === 0 || S.mana < c || S.tools.length >= MAX_TOOLS; })}>不足分を生成して作成 <small>${tx(() => { const c = mc(); return c === null ? '未登録の材料あり' : fmt(c); })}</small></button>
        </div>
      </div>`;
    }).join('');
    return `<h4>${esc(a.name)}の道具</h4>${rows}`;
  }).join('');

  const owned = S.tools.slice().sort((x, y) => SLOTS.findIndex(s => s.id === TOOL[x.b].slot) - SLOTS.findIndex(s => s.id === TOOL[y.b].slot) || TOOL[y.b].base - TOOL[x.b].base || y.q - x.q);
  const ownedRows = owned.map(t => {
    const tr = TOOL[t.b];
    const isEq = S.eq[tr.slot] === t.u;
    const same = true;
    return `<div class="item r${tr.r}${ui.fuse === t.u ? ' sel' : ''}">
      <div class="top-row"><span class="nm">${esc(tr.name)}</span><span class="own small">${isEq ? '<b class="q">装備中</b>' : ''}</span></div>
      <div class="meta">${SLOT[tr.slot].stat} <b>${fmtX(toolEff(t))}</b>　品質 <b class="q">${fmtQ(t.q)}</b></div>
      ${traitTags(t)}
      <div class="acts">
        <button class="btn" type="button" data-act="equip" data-id="${t.u}" ${isEq ? 'disabled' : ''}>${isEq ? '装備中' : '装備する'}</button>
        <button class="btn mana" type="button" data-act="fusesel" data-id="${t.u}" ${same ? '' : 'disabled'}>融合</button>
        ${confirmBtn('', `data-act="scrap" data-id="${t.u}"`, `分解 <small>+${tx(() => fmt(toolValue(t)))}</small>`, 'もう一度タップで分解')}
      </div>
    </div>`;
  }).join('');

  return `
  <section class="area-head"><span class="eyebrow">道具</span><h2>装備と融合</h2></section>
  <div class="slots">${slots}</div>
  <div class="row-between"><p class="small muted">装備中の特性: ${tl || 'なし'}</p><button class="btn" type="button" data-act="traithelp" aria-expanded="${!!ui.traitHelp}">${ui.traitHelp ? '特性の説明を閉じる' : '特性の説明'}</button></div>
  ${ui.traitHelp ? `<div class="panel">

function vMis() {

        ${confirmBtn('', `data-act="brute" data-id="${m.id}" ${dz(() => S.mana < m.brute)}`, `マナで押し通す <small>${fmt(m.brute)}</small>`, 'もう一度タップで確定')}

    <span class="eyebrow">${esc(AREA[ui.misArea].name)}のミッション ${done.length} / ${list.length}</span>

function vReq() {
  const cards = S.reqs.slice(0, REQ_SLOTS).map((r, i) => {
    if (!r || r.wait) {
      return `<div class="mis"><p class="muted small">次の依頼が届くまで ${tx(() => Math.max(0, Math.ceil((((S.reqs[i] && S.reqs[i].wait) || 0) - Date.now()) / 1000)))} 秒</p></div>`;

/* ===================== 操作 ===================== */
function armed(btn) {
  if (btn.classList.contains('armed')) { btn.classList.remove('armed'); return true; }
  btn.classList.add('armed');
  setTimeout(() => btn.classList.remove('armed'), 3000);
  return false;
}
main.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'garea': ui.gArea = id; if (S.unlocked[id]) S.area = id; break;
    case 'unlock': if (canUnlock(id)) unlock(id); break;
    case 'unlockBrute': { const u = AREA[id].unlock; if (S.mana < u.brute) break; if (!armed(b)) return; S.mana -= u.brute; unlock(id); break; }
    case 'disarea': dissolveIds(rawOf(id).map(i => i.id)); break;
    case 'labview': ui.labView = id; break;
    case 'labarea': ui.labArea = id; break;
    case 'dislist': dissolveIds(labIds()); break;
    case 'dis': { const c = inv(id); const g = dissolve(id, c); S.inv[id] = 0; if (g > 0) toast(`${ITEM[id].name}を${fmt(c)}個分解: +${fmt(g)} マナ`); break; }
    case 'force': { const c = unitMana(id) * 10; if (S.mana < c) break; if (!armed(b)) return; S.mana -= c; addItem(id, 1); toast(`強制錬成で${ITEM[id].name}が生まれた`); break; }
    case 'unlockcraft': { const p = ITEM[id]; if (procOn(p)) break; if (canMake(p.in) < 1 && !fillMissing(p.in, 1)) break; if (craft(p, 1)) { toast(`${p.name}を解放しました。これからは自動で加工されます`, 4000); processAuto(); } break; }
    case 'bulkfuse': { const n = Number(id); if (n > 1 && !armed(b)) return; const r = bulkFuse(ui.fuse, n); const t = toolById(ui.fuse); if (r.n && t) toast(`${r.n}回強化合成しました: 品質 ${fmtQ(t.q)}、${traitText(t) || '特性なし'}`, 4000); break; }
    case 'craft': { const p = ITEM[id]; const g = craft(p, canMake(p.in)); if (g) toast(`${p.name}を${fmt(g)}個作りました`); break; }
    case 'refine': { const r = refine(id, 1); if (r.n) toast(perfect(id) ? `${ITEM[id].name}が完璧になりました（価値 ×2.50）` : `${ITEM[id].name}の品質が ${fmtQ(qOf(id))} になりました${r.spent > 0 ? '（' + fmt(r.spent) + ' マナで不足分を生成）' : ''}`); break; }
    case 'refinemax': { if (!armed(b)) return; const r = refine(id, REF_MAX); if (r.n) toast(`${ITEM[id].name}を${r.n}回精錬: ${perfect(id) ? '完璧になりました' : '品質 ' + fmtQ(qOf(id))}${r.spent > 0 ? '（' + fmt(r.spent) + ' マナ使用）' : ''}`); break; }
    case 'mktool': { const t = makeTool(TOOL[id]); if (t) toolToast(t); break; }
    case 'mktoolfill': { if (S.tools.length >= MAX_TOOLS) break; if (fillMissing(TOOL[id].in, 1)) { const t = makeTool(TOOL[id]); if (t) toolToast(t); } break; }
    case 'equip': { const t = toolById(Number(id)); if (t) S.eq[TOOL[t.b].slot] = t.u; break; }
    case 'fusesel': ui.fuse = Number(id); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'fusecancel': ui.fuse = null; break;
    case 'traithelp': ui.traitHelp = !ui.traitHelp; break;
    case 'fuse': { if (!armed(b)) return; if (fuse(ui.fuse, Number(id))) { const t = toolById(ui.fuse); toast(`融合しました: 品質 ${fmtQ(t.q)}、${traitText(t) || '特性なし'}`, 4000); } break; }
    case 'scrap': { if (!armed(b)) return; const u = Number(id); if (ui.fuse === u) ui.fuse = null; const g = scrapTool(u); toast(`道具を分解: +${fmt(g)} マナ`); break; }
    case 'misview': ui.misView = id; break;
    case 'misarea': ui.misArea = id; break;
    case 'claim': { const m = MISS[id]; if (!m || S.done[id] || !ready(m)) break; if (m.deliver) S.inv[m.deliver] -= m.goal; complete(m); break; }
    case 'claimfill': { const m = MISS[id]; if (!m || S.done[id]) break; fillMissing({ [m.deliver]: m.goal }, 1); break; }
    case 'brute': { const m = MISS[id]; if (!m || S.done[id] || S.mana < m.brute) break; if (!armed(b)) return; S.mana -= m.brute; complete(m, 'マナで押し通した'); break; }
    case 'req': deliverReq(Number(id)); break;
    case 'reqfill': { const r = S.reqs[Number(id)]; if (r && !r.wait && fillMissing({ [r.id]: r.n }, 1)) deliverReq(Number(id)); break; }
    case 'reqskip': S.reqs[Number(id)] = { wait: Date.now() + 30000 }; break;
    case 'buy': buy(id); break;
    case 'buymax': { let n = 0; while (n < 1000 && buy(id)) n++; if (n > 1) toast(`${UP[id].name}を${n}レベル上げました`); break; }
  }
  update();
});

/* ===================== セーブ ===================== */
const LS = 'addall.save.v1';
let cloudRef = null, cloudBusy = false, lastCloud = 0, cloudStatus = '確認中';
let bootSavedAt = 0;
const hhmm = t => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function lsLoad() { try { const s = localStorage.getItem(LS); return s ? JSON.parse(s) : null; } catch { return null; } }
function lsSave() {
  try { localStorage.setItem(LS, JSON.stringify(S)); document.getElementById('lsStatus').textContent = '保存済み ' + hhmm(Date.now()); }
  catch { document.getElementById('lsStatus').textContent = 'このブラウザでは保存できません'; }
}
function saveLocal() { S.savedAt = Date.now(); lsSave(); }
function setCloudStatus(s) { cloudStatus = s; document.getElementById('cloudStatus').textContent = s; }
async function cloudSave(force) {
  if (!cloudRef || cloudBusy) return;
  if (!force && Date.now() - lastCloud < 30000) return;
  if (force && Date.now() - lastCloud < 3000) return;
  cloudBusy = true;
  S.savedAt = Date.now();
  try {
    await cloudRef.set({ json: JSON.stringify(S), savedAt: S.savedAt });
    lastCloud = Date.now();
    setCloudStatus('保存済み ' + hhmm(lastCloud));
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { cloudRef = null; setCloudStatus('この表示では保存できません'); }
    else setCloudStatus('保存に失敗しました（あとで再試行）');
  }
  cloudBusy = false;
}
function adopt(obj, withOffline) {
  S = normalize(obj);
  ui.gArea = S.area; ui.misArea = S.area; ui.fuse = null;
  if (withOffline && S.savedAt) { const sec = (Date.now() - S.savedAt) / 1000; if (sec > 10) offline(sec); }
  lastTick = Date.now();
  refreshReqs();
  render();
}
async function cloudInit() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { setCloudStatus('このページの外では使えません'); return; }
  const timer = setTimeout(() => { if (!cloudRef) setCloudStatus('接続できませんでした'); }, 12000);
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { clearTimeout(timer); setCloudStatus('使えません（ブラウザ内にだけ保存）'); return; }
    const uid = await user.id();
    if (!uid) { clearTimeout(timer); setCloudStatus('ログインすると使えます'); return; }
    const ref = db.doc('data/users/' + uid + '/save');
    const snap = await ref.get();
    clearTimeout(timer);
    if (snap.exists) {
      const d = snap.data();
      if (d && typeof d.json === 'string' && Number(d.savedAt) > bootSavedAt + 1000) {
        try { adopt(JSON.parse(d.json), true); toast('claude.aiのセーブデータを読み込みました'); } catch {}
      }
    }
    cloudRef = ref;
    setCloudStatus('接続済み');
    cloudSave(true);
  } catch (e) {
    clearTimeout(timer);
    setCloudStatus('接続できませんでした');
  }
}

/* ===================== ループ ===================== */
let lastTick = Date.now();
const acc = {};
let frame = 0;
function tick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt > 5) { offline(dt); }
  else {
    for (const a of unlockedAreas()) {
      const r = famRate(a.id);
      if (r <= 0) continue;
      acc[a.id] = (acc[a.id] || 0) + r * dt;
      if (acc[a.id] >= 1) { const k = Math.floor(acc[a.id]); acc[a.id] -= k; autoTaps(k, a.id); }
    }
  }
  if (frame % 5 === 0 || dt > 5) processAuto();
  if (frame % 10 === 0) refreshReqs();
  if (++frame % 2 === 0 || dt > 5) update();
}

function start(data) {
  if (data && data.state) {
    S = normalize(data.state);
    if (data.ui) Object.assign(ui, data.ui);
  } else {
    const ls = lsLoad();
    if (ls) S = normalize(ls);
    ui.gArea = S.area; ui.misArea = S.area;
  }
  bootSavedAt = S.savedAt || 0;
  setTabs();
  refreshReqs();
  render();
  if (!(data && data.state) && S.savedAt) { const sec = (Date.now() - S.savedAt) / 1000; if (sec > 10) { offline(sec); update(); } }
  lastTick = Date.now();
  setInterval(tick, 100);
  setInterval(() => { saveLocal(); cloudSave(false); }, 5000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { saveLocal(); cloudSave(true); }
    else { tick(); }
  });
  window.addEventListener('pagehide', () => { saveLocal(); });
  cloudInit();
}

try { window.claude?.hot?.snapshot?.(() => ({ state: S, ui })); } catch {}
const hot = window.claude?.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start(hot?.data ?? {});
})();
</script>
