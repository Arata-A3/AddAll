try { const t = (JSON.parse(localStorage.getItem('addall.save.v1') || '{}').pref || {}).theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>

<style>
/* 工房の帳面: 上に残高（マナ）、中央に作業台、下にタブ。片手の親指で全部届く縦長レイアウト。 */
:root {
  --bg: #edf1ef;
  --surface: #ffffff;
  --surface2: #e2e8e5;
  --ink: #1c2725;
  --muted: #5b6a66;
  --line: #cfd8d4;
  --brass: #8a5d17;
  --brass-soft: #f2e4c9;
  --mana: #3d4fc4;
  --mana-soft: #dde2fa;
  --ok: #26754d;
  --ok-soft: #d6eee0;
  --bad: #b0402c;
  --r0: #77827f;
  --r1: #4c7c37;
  --r2: #2c70a4;
  --r3: #7a4cbd;
  --r4: #a8740a;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111918; --surface: #1a2422; --surface2: #23302d; --ink: #e5ece9; --muted: #95a5a1; --line: #2f3d3a;
    --brass: #d9a94f; --brass-soft: #3a2f1a; --mana: #9eabff; --mana-soft: #262c52; --ok: #6fcf9b; --ok-soft: #1c3a2a; --bad: #ff8f78;
    --r0: #9aa6a3; --r1: #8cc46f; --r2: #6fb5ea; --r3: #b893f2; --r4: #f0bf4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111918; --surface: #1a2422; --surface2: #23302d; --ink: #e5ece9; --muted: #95a5a1; --line: #2f3d3a;
  --brass: #d9a94f; --brass-soft: #3a2f1a; --mana: #9eabff; --mana-soft: #262c52; --ok: #6fcf9b; --ok-soft: #1c3a2a; --bad: #ff8f78;
  --r0: #9aa6a3; --r1: #8cc46f; --r2: #6fb5ea; --r3: #b893f2; --r4: #f0bf4c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--mana); outline-offset: 2px; }

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 上部: 残高 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding-block: 10px;
}
.brand { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .04em; color: var(--brass); }
.bal { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.bal .lab { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.bal b { font-size: 24px; font-weight: 700; color: var(--mana); white-space: nowrap; }
.bal small { font-size: 12px; color: var(--muted); min-height: 1em; }
.top { flex-wrap: wrap; row-gap: 8px; }
.goal { order: 3; flex: 1 0 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; row-gap: 4px; align-items: center; text-align: left; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.goal .gl { font-size: 11px; font-weight: 700; color: var(--surface); background: var(--brass); border-radius: 6px; padding: 1px 6px; letter-spacing: .08em; }
.goal .gt { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.goal .gb { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.goal .gb i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .3s; }
.goal.ok { border-color: var(--ok); }
.goal.ok .gl { background: var(--ok); }
.tabs button.new::after { content: ""; position: absolute; top: 8px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--mana); }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

main { padding-block: 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px); max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 17px; margin: 0; }
h4 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 6px 0 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.lack { color: var(--bad); }

/* 下部: タブ */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(var(--ntabs, 6), minmax(0, 1fr));
}
.tabs button {
  height: var(--nav-h); border: 0; background: none; cursor: pointer; position: relative; min-width: 0;
  font-size: 11px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; white-space: nowrap;
}
.tabs button .k { font-family: var(--f-display); font-size: 19px; font-weight: 800; line-height: 1; }
.tabs button[aria-selected="true"] { color: var(--brass); }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brass); }
.badge { position: absolute; top: 6px; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--ok); color: var(--surface); font-size: 11px; font-weight: 700; line-height: 18px; }

/* 説明の折りたたみ */
details.help { font-size: 13px; color: var(--muted); }
details.help summary { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; list-style: none; font-size: 12px; color: var(--mana); padding: 2px 0; }
details.help summary::-webkit-details-marker { display: none; }
details.help summary::before { content: "？"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--mana-soft); color: var(--mana); font-weight: 700; font-size: 11px; }
details.help[open] summary { margin-bottom: 4px; }
.help-body { display: flex; flex-direction: column; gap: 6px; background: var(--surface2); border-radius: 10px; padding: 10px 12px; line-height: 1.7; }
.help-body p { color: var(--muted); }

/* 共通部品 */
.btn {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 10px;
  min-height: 40px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.25; text-align: center;
}
.btn.pri { background: var(--brass); border-color: var(--brass); color: var(--surface); font-weight: 700; }
.btn.mana { background: var(--mana-soft); border-color: transparent; color: var(--mana); font-weight: 700; }
.btn.okb { background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 700; }
.btn:disabled { opacity: .42; cursor: default; }
.btn small { font-weight: 400; font-size: 12px; opacity: .9; }
.btn .cf { display: none; }
.btn.armed .lbl { display: none; }
.btn.armed .cf { display: inline; }
.btn.armed { background: var(--brass-soft); color: var(--brass); border-color: var(--brass); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts .btn { flex: 1 1 120px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 100%; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; min-height: 36px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass-soft); color: var(--brass); font-weight: 700; }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.chip.locked { color: var(--muted); border-style: dashed; }
.chip.locked[aria-pressed="true"] { color: var(--bg); }
.r0 { --rc: var(--r0); } .r1 { --rc: var(--r1); } .r2 { --rc: var(--r2); } .r3 { --rc: var(--r3); } .r4 { --rc: var(--r4); }
.rc { color: var(--rc); }
.prog { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--brass); border-radius: 4px; transition: width .2s; }
.q { font-size: 12px; font-weight: 700; color: var(--brass); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; border-radius: 6px; padding: 1px 8px; background: var(--mana-soft); color: var(--mana); white-space: nowrap; }
.tag.none { background: var(--surface2); color: var(--muted); }

/* 採取 */
.area-head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.tapzone { position: relative; display: grid; place-items: center; padding-block: 8px; overflow: hidden; border-radius: 16px; }
.tap {
  width: min(62vw, 230px); max-width: 100%; aspect-ratio: 1; border-radius: 50%;
  border: 2px solid var(--brass); cursor: pointer; user-select: none; -webkit-user-select: none;
  background: radial-gradient(circle at 50% 38%, var(--mana-soft) 0%, var(--surface) 68%);
  box-shadow: inset 0 0 0 9px var(--surface), inset 0 0 0 10px var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .07s ease-out;
  position: relative; overflow: visible;
}
.tap b { font-family: var(--f-display); font-size: 26px; font-weight: 800; }
.tap small { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.tap.hit { transform: scale(.955); }
.pt { position: absolute; pointer-events: none; font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--rc); text-shadow: 0 1px 0 var(--bg); animation: rise .95s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -64px); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .lab { font-size: 12px; color: var(--muted); }
.stat b { font-size: 18px; overflow-wrap: anywhere; line-height: 1.25; }
.stat small { font-size: 11px; color: var(--muted); }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--brass); flex: none; }

/* 一覧の行（素材・レシピ・道具） */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.item .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.item .nm { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.item .meta { font-size: 12px; color: var(--muted); }
.item .own { font-size: 13px; white-space: nowrap; }
.item .own b { font-size: 16px; }
.item.unknown .nm { color: var(--muted); letter-spacing: .1em; }
.item.sel { box-shadow: 0 0 0 2px var(--mana) inset; }
.ins { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; }

/* ホムンクルス */
.hom { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.hom.sel { box-shadow: 0 0 0 2px var(--mana) inset; }
/* 相棒の絵 */
.himg { display: block; max-width: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
.face { flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--mana-soft); position: relative; }
.face .himg { position: absolute; top: 1px; left: 50%; transform: translateX(-50%); height: 112px; width: auto; }
.mkname { display: inline-flex; align-items: center; gap: 8px; }
.hom .top-row:has(.mkname) { align-items: center; }
.hpline .face { width: 28px; height: 28px; }
.hpline .face .himg { height: 78px; }
.hpline.down .face .himg { filter: grayscale(1); opacity: .6; }
.khead { display: flex; gap: 12px; align-items: flex-start; }
.kimg { height: 150px; width: auto; flex: none; }
.kinfo { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.pickwho { display: flex; gap: 10px; align-items: center; }
.paths3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pth { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; min-width: 0; }
.pth.top { border-color: var(--brass); }
.pth small { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.pth .rk { color: var(--mana); margin-left: 2px; }
.pth.top .rk { color: var(--brass); }
.grow .gps { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.grow .gp b { color: var(--mana); }
.grow .gp.top b { color: var(--brass); }
.seg .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mana); margin-left: 4px; vertical-align: middle; }
.pickwho .himg { height: 84px; width: auto; flex: none; }
.buddy { position: absolute; right: 2px; bottom: 2px; display: flex; flex-direction: column; align-items: center; pointer-events: none; animation: bob 3.2s ease-in-out infinite; }
.buddy .himg { height: 150px; width: auto; }
.buddy span { font-size: 11px; color: var(--muted); margin-top: -2px; }
.buddy.idle { animation-duration: 6s; }
.buddy.hop .himg { animation: hop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes hop { 40% { transform: translateY(-10px); } }
.hom .nm { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.hom .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.prog.thin { height: 5px; }
.prog.thin i { background: var(--mana); }
.tag.top { background: var(--brass-soft); color: var(--brass); font-weight: 700; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.panel.fuse { border-color: var(--mana); }

.hpline { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.hpbar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--ok); }
.hpline.down { color: var(--muted); }
.paths { display: flex; flex-direction: column; gap: 8px; }
.path { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.path b { font-family: var(--f-display); font-size: 16px; }
.path.foe { border-left-color: var(--r2); } .path.elite { border-left-color: var(--r3); } .path.boss { border-left-color: var(--bad); }
.path.chest { border-left-color: var(--r4); } .path.spring { border-left-color: var(--ok); } .path.altar { border-left-color: var(--mana); }

/* 1行の一覧 */
.row1 { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--line)); border-radius: 10px; padding: 8px 10px; }
.row1 .r1main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.row1 .nm { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.row1 .meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.row1.unknown .nm { color: var(--muted); letter-spacing: .1em; }
.btn.sm { min-height: 36px; padding: 4px 10px; font-size: 13px; flex: none; }
.list.tight { gap: 6px; }

/* 道具 */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc, var(--line)); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slot .lab { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.slot b { font-family: var(--f-display); font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.slot .eff { font-size: 13px; color: var(--brass); font-weight: 700; }

/* 図鑑 */
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .no { font-size: 11px; color: var(--muted); letter-spacing: .1em; display: flex; justify-content: space-between; gap: 6px; }
.card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
.card .num { font-size: 12px; color: var(--muted); margin-top: auto; }
.card.unknown { background: var(--surface2); border-top-color: var(--line); }
.card.unknown h3 { color: var(--muted); letter-spacing: .15em; }

/* 古いノート */
.journal { display: flex; flex-direction: column; gap: 12px; }
.page { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.page h3 { font-size: 19px; }
.page p { font-family: var(--f-display); font-size: 15px; line-height: 1.9; max-width: 34em; }
.page .no { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.page.locked { background: var(--surface2); border-left-color: var(--line); padding-block: 10px; }
.page.locked p { font-family: var(--f-body); font-size: 13px; }

/* ミッション */
.bonus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13px; }

.mis .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rw { font-size: 12px; font-weight: 700; color: var(--brass); background: var(--brass-soft); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }

.mis.done .nm { color: var(--muted); }
.mis.done .ck { color: var(--ok); font-weight: 700; font-size: 13px; white-space: nowrap; }

/* 強化 */
.up { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.up .lv { font-size: 13px; color: var(--muted); }
.up .eff { font-size: 14px; }
.up .eff b { color: var(--brass); }
.up .acts .btn:first-child { flex: 2 1 160px; }

.ms { display: flex; flex-direction: column; gap: 3px; }
.ms .prog { height: 6px; }
.ms b { color: var(--brass); }
.rate-panel .big { font-size: 22px; font-weight: 700; color: var(--mana); }
.cmp { color: var(--ok); font-weight: 700; }
.ver { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--muted); background: none; border: 0; padding: 2px 0 0; cursor: pointer; letter-spacing: 0; }
.picks { border: 2px solid var(--mana); }
.pick-opts { display: grid; grid-template-columns: 1fr; gap: 6px; }
.pick-opts .btn { flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 10px 12px; }
.pick-opts .btn span { font-weight: 700; }
.pick-opts .btn small { font-size: 12px; }
.vh-item { border-top: 1px solid var(--line); padding-top: 8px; }
.vh-item ul { margin: 4px 0 0; padding-left: 1.2em; font-size: 13px; }

[hidden] { display: none !important; }
.rs-step { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); }
.rs-step .st { flex: none; min-width: 3.2em; font-size: 12px; color: var(--muted); }
.rs-step.done .st { color: var(--ok); font-weight: 700; }
.rs-step.next { font-weight: 700; }
.rs-step.lock { color: var(--muted); }
.ch.sel { border-color: var(--mana); box-shadow: 0 0 0 2px var(--mana-soft); }
.town { border-left: 3px solid var(--line); padding-left: 8px; color: var(--muted); font-style: normal; }
.bond { display: flex; gap: 4px; }
.bond i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.bond i.on { background: var(--ok); }
.ask { font-size: 14px; line-height: 1.6; }
/* 設定シート */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px; font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; word-break: break-all; }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }

@keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.cele { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); min-width: min(300px, calc(100% - 48px)); max-width: calc(100% - 32px);

  box-shadow: 0 0 0 6px color-mix(in srgb, var(--cc, var(--brass)) 18%, transparent), 0 0 70px 24px color-mix(in srgb, var(--cc, var(--brass)) 30%, transparent), 0 18px 50px rgb(0 0 0 / .35);
  animation: celeIn .55s cubic-bezier(.2, 1.6, .4, 1) both, celeOut .35s ease-in 1.9s forwards; }
.cele .ck { font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--cc, var(--brass)); }

@keyframes celeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes celeOut { to { opacity: 0; transform: translate(-50%, -60%) scale(.96); } }
@keyframes glow { from { opacity: 0; transform: scale(.4); } 40% { opacity: 1; } to { opacity: .6; transform: scale(1.1); } }
.banner { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 128px); transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--mana); color: var(--surface); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 8px 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 6px 20px rgb(0 0 0 / .25); animation: banIn .35s cubic-bezier(.2, 1.5, .4, 1) both, banOut .3s ease-in 1.6s forwards; }
.banner.okc { background: var(--ok); }
.banner.withimg { display: flex; align-items: center; gap: 8px; padding-left: 4px; }

@keyframes banOut { to { opacity: 0; transform: translate(-50%, -10px); } }
.spark { position: absolute; width: 8px; height: 8px; border-radius: 2px; background: var(--sc, var(--brass)); animation: spark .8s cubic-bezier(.1, .8, .3, 1) forwards; }
@keyframes spark { from { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.4); } }
.ripple { position: absolute; left: 50%; top: 50%; width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--brass); transform: translate(-50%, -50%) scale(.6); opacity: .8; pointer-events: none; animation: ripple .55s ease-out forwards; }
@keyframes ripple { to { transform: translate(-50%, -50%) scale(1.25); opacity: 0; } }
.pt.big { font-size: 20px; font-family: var(--f-display); font-weight: 800; animation-duration: 1.4s; text-shadow: 0 0 12px color-mix(in srgb, var(--rc) 60%, transparent), 0 1px 0 var(--bg); }
.bal b.pulse { animation: pulse .5s ease-out; }
@keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.18); text-shadow: 0 0 14px var(--mana); } 100% { transform: scale(1); } }
.mis.ready { animation: readyGlow 1.8s ease-in-out infinite; }

.bal b { display: inline-block; transform-origin: right center; }

@media (prefers-reduced-motion: reduce) {

function normalize(o) {
  const f = fresh();
  if (!o || typeof o !== 'object') return f;
  for (const k in f) {
    if (o[k] === undefined || o[k] === null) continue;
    if (f[k] && typeof f[k] === 'object' && !Array.isArray(f[k])) {
      f[k] = Object.assign(f[k], o[k]);
      if (k === 'st') for (const kk of ['areaTaps', 'crafted']) f.st[kk] = Object.assign({}, o.st[kk] || {});
    } else f[k] = o[k];
  }
  if (!AREA[f.area] || !f.unlocked[f.area]) f.area = 'a1';

  if (!Array.isArray(f.homs)) f.homs = [];

  if (!KIND[f.fav]) f.fav = null;
  for (const k of ['curve', 'prevCurve']) if (!Array.isArray(f[k])) f[k] = [];

  // 実績のための通算の記録がなかった頃のセーブは、この周の記録で補う
  if (!f.life.taps) f.life.taps = (f.st.manual || 0) + (f.st.auto || 0);
  if (!f.life.crafts) f.life.crafts = Object.values(f.st.crafted || {}).reduce((a, b) => a + (b || 0), 0);
  if (!f.life.reqs) f.life.reqs = f.st.reqDone || 0;
  delete f.party;
  delete f.maze; delete f.mazeTeam; delete f.mazeLast;
  // 道具だった頃のセーブ: 装備していた道具を、同じ枠の役目のホムンクルスに変えて引き継ぐ
  if ((o.v || 1) < 5 && Array.isArray(o.tools) && o.eq) {
    const byTool = { hand: 'koro', waist: 'happa', neck: 'happa' };
    const slotOf = b => /Pick$/.test(b) ? 'hand' : /Flute$|Bell$|Horn$/.test(b) ? 'waist' : 'neck';
    for (const slot of ['hand', 'waist', 'neck']) {
      const t = o.tools.find(x => x && x.u === o.eq[slot]);
      if (!t) continue;
      const k = KIND[byTool[slotOf(t.b)]];
      const h = { u: f.homSeq++, k: k.id, lv: 1, xp: 0, f: 0, pk: [] };
      h.sk = Object.entries(t.t || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, lv]) => ({ id, r: Math.min(RANK_MAX, Math.floor(Math.log2(lv + 1))) }));
      f.homs.push(h);
    }
    f.st.homsMade = Math.max(f.st.homsMade || 0, o.st && o.st.toolsMade ? 1 : 0);
  }
  // 技能と能力があった頃（v2.2 まで）の相棒は、道のランクに引き継ぐ。
  // 道もなかった頃のセーブ（同じ種類が何人もいる形）は、種類ごとに1人にまとめ、過ぎた節目の道を選べるようにする
  const noPath = f.homs.some(h => !h.rk && !Array.isArray(h.path));
  for (const h of f.homs) toRanks(h);
  if (noPath || new Set(f.homs.map(h => h.k)).size < f.homs.length) {
    f.homs = mergeByKind(f.homs, false);
    if (noPath) for (const h of f.homs) h.pk = PATH_LV.filter(l => h.lv >= l).map(() => ({ t: 'p' }));
  }
  // 使い魔が1種類だった頃のセーブは、そのレベルを裏山の使い魔に引き継ぐ
  if (f.up.familiar !== undefined) { if (!f.up.fam_a1) f.up.fam_a1 = f.up.familiar; delete f.up.familiar; }
  // 探索の回数を記録していなかった頃のセーブは、裏山の探索を累計の採取回数で補う
  if (!f.st.areaTaps.a1) f.st.areaTaps.a1 = (f.st.manual || 0) + (f.st.auto || 0) - (f.st.areaTaps.a2 || 0) - (f.st.areaTaps.a3 || 0);
  for (const i of ITEMS) if ((f.inv[i.id] || 0) > 0 || (f.col[i.id] || 0) > 0 || (f.st.crafted[i.id] || 0) > 0) f.reg[i.id] = true;
  // 3枠の依頼だった頃のセーブは捨てて、町の人ごとの頼みごとに作り直す
  if (!f.reqs || typeof f.reqs !== 'object' || Array.isArray(o.reqs)) f.reqs = {};
  for (const k in f.reqs) { const r = f.reqs[k]; if (!PERSON[k] || !r || (!r.wait && !ITEM[r.id])) delete f.reqs[k]; }
  // 第1版の任務IDは内容が変わったので、同じ内容のものだけ引き継ぐ
  if ((o.v || 1) < 2) {
    const keep = {};
    if (o.done) { if (o.done.m1) keep.m1 = 1; if (o.done.m2) keep.m2 = 1; if (o.done.m3) keep.m3 = 1; if (o.done.m4) keep.m4 = 1; if (o.done.m6) keep.m7 = 1; if (o.done.m10) keep.m13 = 1; if (o.done.m11) keep.m12 = 1; if (o.done.m14) keep.m15 = 1; }
    f.done = keep;
  }
  // 精錬が「無限に近づく」方式だった頃の回数を、20段階に置き換える（品質は下がらないように切り上げ）
  if ((o.v || 1) < 3) {

  if ((o.v || 1) < 4) {
    f.mc = {}; for (const id in f.done) if (f.done[id]) f.mc[id] = 1;

  if ((o.v || 1) < 6) f._migrateOpen = true;
  f.v = 6;
  return f;
}

// 段は限りなく続く。1段ごとに、関係する効果が ×1.05（周回しても残る）
const ACH_STEP = 1.05;
const ACHS = [
  { id: 'taps', name: '採取の手', what: '採取した回数（使い魔の分も含む）', perk: 'power', v: () => S.life.taps || 0, base: 100, mul: 10 },
  { id: 'mana', name: 'マナの海', what: '集めたマナの累計', perk: 'mana', v: () => S.life.totalMana || 0, base: 1e3, mul: 100 },
  { id: 'craft', name: '作る手', what: '加工した回数', perk: 'skill', v: () => S.life.crafts || 0, base: 10, mul: 10 },
  { id: 'reqs', name: '町の顔なじみ', what: '頼みごとをかなえた回数', perk: 'explore', v: () => S.life.reqs || 0, base: 3, mul: 3 },
  { id: 'ranks', name: '完璧への道', what: '相棒の道のランクの段数の合計', perk: 'exp', v: () => rankSumAll(), step: 5 },
  { id: 'runs', name: '春をくり返す', what: '周回した回数', perk: 'fam', v: () => S.life.prestiges || 0, step: 1 },
];
const ACH_PERK = { power: '採取力', mana: 'マナ', skill: '熟練の伸び', explore: '探索の進み', exp: 'ホムンクルスの経験値', fam: '使い魔の速さ' };
function achTier(a) {
  const v = a.v();
  if (a.step) return Math.floor(v / a.step);
  if (v < a.base) return 0;
  return Math.floor(Math.log(v / a.base) / Math.log(a.mul) + 1e-9) + 1;
}
const achNext = a => a.step ? (achTier(a) + 1) * a.step : a.base * a.mul ** achTier(a);
const achPrev = a => a.step ? achTier(a) * a.step : achTier(a) ? a.base * a.mul ** (achTier(a) - 1) : 0;
const achMult = perk => ACH_STEP ** ACHS.filter(a => a.perk === perk).reduce((s, a) => s + achTier(a), 0);
const achTotal = () => ACHS.reduce((s, a) => s + achTier(a), 0);
function checkAch() {
  S.life.achSeen = S.life.achSeen || {};
  for (const a of ACHS) {
    const t = achTier(a), seen = S.life.achSeen[a.id];
    if (seen === undefined) { S.life.achSeen[a.id] = t; continue; }
    if (t > seen) {
      S.life.achSeen[a.id] = t;
      celebrate('実績', `${a.name} ${t}段`, `${ACH_PERK[a.perk]} ${fmtX(achMult(a.perk))}（ずっと残る）`, 'var(--brass)');
    }
  }
}
// 町の人と実績をまとめた倍率
const boost = perk => bondMult(perk) * achMult(perk);

function newReq(p) {

  const scale = 1 + Math.log10(1 + power());
  const n = Math.max(1, Math.ceil((5 + Math.random() * 20) * scale * (it.kind === 'proc' ? 0.3 : 1)));

function deliverReq(pid) {
  const r = S.reqs[pid], p = PERSON[pid];
  if (!p || !r || r.wait || inv(r.id) < r.n) return false;
  S.inv[r.id] -= r.n;
  addMana(r.rw);

}

function areaChips(cur, act, opts = {}) {
  const list = AREAS.filter((a, i) => S.unlocked[a.id] || (opts.showNext && i > 0 && S.unlocked[AREAS[i - 1].id]));
  const chips = list.map(a => `<button type="button" class="chip${S.unlocked[a.id] ? '' : ' locked'}" data-act="${act}" data-id="${a.id}" aria-pressed="${a.id === cur}">${S.unlocked[a.id] ? '' : '未解放　'}${esc(a.name)}</button>`);
  if (opts.extra) chips.push(...opts.extra);
  return `<div class="chips">${chips.join('')}</div>`;
}

let tapHitTimer = 0;
// 採取の画面の相棒: 採取すると笑顔、しばらく放っておくと眠る（ミスティアは怒る）
const BUDDY_IDLE = 20000;
let buddyFace = 0, buddyAt = Date.now(), buddyTimer = 0;
function setBuddy(face) {
  buddyFace = face;
  const el = document.getElementById('buddy');
  const k = favKind();
  if (!el || !k) return;
  const img = el.querySelector('img');

function buddyTap() {
  buddyAt = Date.now();
  setBuddy(1);
  const el = document.getElementById('buddy');
  if (el && !reduceMotion) { el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
  clearTimeout(buddyTimer);
  buddyTimer = setTimeout(() => setBuddy(0), 1400);
}
function buddyIdle() { if (buddyFace === 0 && Date.now() - buddyAt > BUDDY_IDLE) setBuddy(2); }
function bindTap() {
  const t = document.getElementById('tap');
  const z = document.getElementById('tapzone');
  if (!t) return;
  const go = (x, y) => {
    S.area = ui.gArea;
    S.st.manual++;
    S.life.taps = (S.life.taps || 0) + 1;
    S.st.areaTaps[S.area] = (S.st.areaTaps[S.area] || 0) + exploreMult();
    S.skill += skillGain();
    gainExp(EXP_TAP);
    const got = gather(power());
    buddyTap();
    t.classList.add('hit');
    if (!reduceMotion && z.querySelectorAll('.ripple').length < 4) { const rp = document.createElement('span'); rp.className = 'ripple'; t.appendChild(rp); setTimeout(() => rp.remove(), 600); }
    clearTimeout(tapHitTimer);
    tapHitTimer = setTimeout(() => t.classList.remove('hit'), 70);
    const zr = z.getBoundingClientRect();
    const ids = Object.keys(got).sort((a, b) => ITEM[b].v - ITEM[a].v).slice(0, 2);
    ids.forEach((id, k) => {
      if (z.querySelectorAll('.pt').length > 10) return;
      const p = document.createElement('div');
      const m = ITEM[id];
      p.className = 'pt r' + m.r + (m.r >= 3 ? ' big' : '');
      if (m.r >= 3 && k === 0) sparks(x, y, RC(m.r), m.r >= 4 ? 22 : 12, m.r >= 4 ? 120 : 80);
      p.textContent = `+${fmt(got[id])} ${m.name}`;
      p.style.left = Math.min(Math.max(x - zr.left + (Math.random() * 40 - 20), 70), zr.width - 70) + 'px';
      p.style.top = (y - zr.top - 24 - k * 22) + 'px';
      z.appendChild(p);
      setTimeout(() => p.remove(), m.r >= 3 ? 1450 : 1000);
    });
    update();
  };
  t.addEventListener('pointerdown', e => { e.preventDefault(); go(e.clientX, e.clientY); });
  t.addEventListener('click', e => {
    if (e.detail !== 0) return; // キーボード操作のときだけ
    const r = t.getBoundingClientRect();
    go(r.left + r.width / 2, r.top + r.height / 2);
  });
}

  const effects = used.map(r => `<div class="row-between"><span>${esc(ROLES[r].fx)}</span><b>${tx(() => ROLES[r].add ? '目利き +' + fmtD(roleAdd(r)) : fmtX(roleMult(r)))}</b></div>`).join('');
  const fk = favKind();
  const cards = KINDS.map(k => S.homs.find(h => h.k === k.id)).filter(Boolean).map(h => {
    const k = KIND[h.k], fav = fk === k.id, ult = isUltimate(h);
    return `<div class="panel kind r${k.r}">
      <div class="khead">${homImg(k.id, fav || ult ? 1 : 0, 'himg kimg')}
        <div class="kinfo"><h3>${esc(k.name)}${ult ? ' <span class="tag top">完璧</span>' : ''}</h3>
          <p class="small muted">${esc(k.d)}</p>
          ${lvLine(h)}
          ${fav ? '<span class="tag top">採取に連れている</span>' : `<button class="btn sm" type="button" data-act="fav" data-id="${k.id}">採取に連れていく</button>`}
        </div></div>
      ${pathLine(h)}
    </div>`;
  }).join('');
  const kinds = unlockedAreas().map(a => {
    const rows = KINDS.filter(k => k.area === a.id && !S.homs.some(h => h.k === k.id)).map(k => {
      const mc = () => missingCost(k.in, 1);
      return `<div class="item r${k.r}">
        <div class="top-row"><span class="nm mkname">${homFace(k.id)}${esc(k.name)}</span><span class="own small muted">道: ${KIND_ROLES[k.id].map(r => ROLES[r].name).join('・')}</span></div>
        <p class="small muted">${esc(k.d)}</p>
        ${insHtml(k.in, 1)}
        <div class="acts">
          <button class="btn pri" type="button" data-act="mkhom" data-id="${k.id}" ${dz(() => canMake(k.in) < 1)}>生み出す</button>
          <button class="btn mana" type="button" data-act="mkhomfill" data-id="${k.id}" ${dz(() => { const c = mc(); return c === null || c === 0 || S.mana < c; })}>不足分を生成して生み出す <small>${tx(() => { const c = mc(); return c === null ? '未登録の材料あり' : fmt(c); })}</small></button>
        </div>
      </div>`;
    }).join('');
    return rows ? `<h4>${esc(a.name)}で生まれる子</h4>${rows}` : '';
  }).join('');
  return `
  <section class="area-head"><span class="eyebrow">相棒</span><h2>ホムンクルス</h2>
    ${help('tools', `<p class="muted small">相棒は時間とともに育ち、レベルが上がるたびに道の効果が少しずつ強くなります。Lv5・10・15・20 の節目では、その子の3本の道から1つを選んで、ランクを上げます（E・D・C・B・A・S・S+）。ランクが1つ上がるごとに効果が大きく伸びます。</p><p class="muted small">周回すると、相棒は Lv1 から育ち直します。ランクはそのまま残るので、周回するたびに強くなります。3本とも S+ で「完璧」。その先も ★ で限りなく伸びます。</p>`)}</section>
  ${vPicks()}
  ${S.homs.length ? `<div class="panel">
    <div class="small muted">相棒みんなの効果</div>
    <div class="list tight">${effects}</div>
  </div>` : ''}
  ${cards || '<p class="small muted">まだホムンクルスがいません。下の「生み出す」で作ってみましょう。</p>'}
  ${kinds ? `<h3>生み出す</h3><div class="list">${kinds}</div>` : ''}`;
}

/* --- ミッションと依頼 --- */
// 町: 町の人の頼みごとと、ミッションを1つの画面に
function vMission() {
  return `${featOpen('req') ? vReq() : ''}${vMis()}`;
}
function vMis() {
  if (!S.unlocked[ui.misArea]) ui.misArea = 'a1';
  const list = MIS.filter(m => m.area === ui.misArea);
  const open = list.filter(misOpen);
  const done = list.filter(m => !misOpen(m));
  const card = m => {
    const cur = () => m.deliver ? Math.min(inv(m.deliver), m.goal) : Math.min(m.prog(), m.goal);
    const gen = m.deliver ? () => { const c = missingCost({ [m.deliver]: m.goal }, 1); return c; } : null;
    return `<div class="mis" ${cl(() => ready(m), 'ready')}>
      <div class="hd"><h3>${esc(m.name)}</h3><span class="rw">${RW_NAME[m.rw[0]]} ${fmtX(m.rw[1])}</span></div>
      <p class="tx">${esc(m.text)}</p>
      ${S.run > 1 ? `<p class="small muted">これまでに ${tx(() => fmt(S.mc[m.id] || 0))} 回達成${tx(() => misBehind(m) > 1 ? `　取り返し あと${misBehind(m)}回` : '')}</p>` : ''}
      <div class="prog"><i ${wd(() => cur() / m.goal * 100)}></i></div>
      <div class="pv">${m.deliver ? '手持ち ' : ''}${tx(() => fmt(cur()))} / ${fmt(m.goal)}</div>
      <div class="acts">
        <button class="btn okb" type="button" data-act="claim" data-id="${m.id}" ${dz(() => !ready(m))}>${m.deliver ? '納品する' : '受け取る'}</button>
        ${m.deliver ? `<button class="btn mana" type="button" data-act="claimfill" data-id="${m.id}" ${dz(() => { const c = gen(); return ready(m) || c === null || S.mana < c; })}>不足分を生成 <small>${tx(() => { const c = gen(); return c === null ? '未登録' : fmt(c); })}</small></button>` : ''}
        ${confirmBtn('', `data-act="brute" data-id="${m.id}" ${dz(() => S.mana < m.brute)}`, `マナで押し通す <small>${fmt(m.brute)}</small>`, 'もう一度タップで確定')}
      </div>
    </div>`;
  };
  const doneRow = m => `<div class="mis done"><span class="nm">${esc(m.name)}</span><span class="ck">達成${S.run > 1 ? '（累計' + fmt(S.mc[m.id]) + '回）' : ''} ${RW_NAME[m.rw[0]]} ${fmtX(m.rw[1])}</span></div>`;
  const bonus = Object.keys(RW_NAME).map(k => `<div class="row-between"><span>${RW_NAME[k]}</span><b>${fmtX(mult(k))}</b></div>`).join('');
  return `${areaChips(ui.misArea, 'misarea')}
  <section class="area-head">
    <span class="eyebrow">${esc(AREA[ui.misArea].name)}のミッション ${done.length} / ${list.length}</span>
    ${help('mis', `<p class="muted small">達成すると、ずっと続く強化がもらえます。条件を満たせないときは、マナで押し通すこともできます。ミッションは周回のたびに最初からになり、報酬は周回ごとに重なります。前の周で達成しなかったものは、その分だけ続けて達成して取り返せます。</p>`)}
  </section>
  <div class="panel"><div class="small muted">ミッションで得た強化（すべての採取地の合計）</div><div class="bonus">${bonus}</div></div>
  ${open.map(card).join('')}
  ${done.length ? `<h4>達成済み</h4>${done.map(doneRow).join('')}` : ''}`;
}
const personUnread = p => { if (!S.met[p.id]) return 0; let n = 0; for (let l = 0; l <= bondLv(p.id); l++) if (!S.scn[sceneKey(p.id, l)]) n++; return n; };
function vReq() {
  const cards = PEOPLE.filter(p => S.met[p.id]).map(p => {
    const lv = bondLv(p.id), r = S.reqs[p.id], un = personUnread(p);
    let body;
    if (!r || r.wait) {
      body = r && r.none
        ? `<p class="small muted">今は特に頼みごとはないみたい（好きな素材が図鑑に載ると頼まれます）</p>`
        : `<p class="small muted">次の頼みごとまで ${tx(() => { const q = S.reqs[p.id]; return Math.max(0, Math.ceil((((q && q.wait) || 0) - Date.now()) / 1000)); })} 秒</p>`;
    } else {
      const m = ITEM[r.id];
      const mc = () => missingCost({ [r.id]: r.n }, 1);
      body = `<p class="ask">${esc(p.ask[r.a || 0](m.name, fmt(r.n)))}</p>
      <div class="row-between small"><span class="rc r${m.r}">${esc(m.name)} を ${fmt(r.n)}個</span><span class="rw">+${fmt(r.rw)} マナ・信頼+1・仲+1</span></div>
      <div class="prog"><i ${wd(() => Math.min(1, inv(r.id) / r.n) * 100)}></i></div>
      <div class="pv">手持ち ${tx(() => fmt(inv(r.id)))} / ${fmt(r.n)}</div>
      <div class="acts">
        <button class="btn okb" type="button" data-act="req" data-id="${p.id}" ${dz(() => inv(r.id) < r.n)}>渡す</button>
        ${inv(r.id) >= r.n ? '' : `<button class="btn mana" type="button" data-act="reqfill" data-id="${p.id}" ${dz(() => { const c = mc(); return inv(r.id) >= r.n || c === null || S.mana < c; })}>不足分を生成して渡す <small>${tx(() => { const c = mc(); return c === null ? '-' : fmt(c); })}</small></button>`}
        <button class="btn sm" type="button" data-act="reqskip" data-id="${p.id}">また今度</button>
      </div>`;
    }
    return `<div class="mis" ${cl(() => !!(S.reqs[p.id] && !S.reqs[p.id].wait && inv(S.reqs[p.id].id) >= S.reqs[p.id].n), 'ready')}>
      <div class="hd"><h3>${esc(p.name)}</h3><span class="rw">${PERK_NAME[p.perk]} ${fmtX(perkOf(p.id))}</span></div>
      <p class="small muted">${esc(p.role)}　仲 ${lv} / ${BOND_MAX}${lv < BOND_MAX ? `（次の段まで あと${bondNext(p.id) - bondPts(p.id)}回）` : '（いちばん深い）'}</p>
      <div class="bond">${'<i class="on"></i>'.repeat(lv)}${'<i></i>'.repeat(BOND_MAX - lv)}</div>
      ${body}
      <div class="acts"><button class="btn${un ? ' mana' : ''}" type="button" data-act="story" data-id="${p.id}">話を読む${un ? `（新しい話 ${un}）` : ''}</button></div>
    </div>`;
  }).join('');
  const later = PEOPLE.filter(p => !S.met[p.id]).map(p => `<div class="mis done"><span class="nm">まだ会っていない人</span><span class="ck">${esc(p.meetHint)}</span></div>`).join('');
  return `<section class="area-head">
    <span class="eyebrow">町の人</span>
    ${help('req', `<p class="muted small">町の人から、素材の頼みごとが届きます。渡すとマナと信頼が手に入り、その人との仲が深まります。仲が1段深まるごとに、その人に関わる効果がずっと上がり、新しい話を読めます。仲は周回しても残ります（相手は覚えていなくても、どこかで覚えているようです）。信頼が1増えるごとに、マナが3%増えます。</p>`)}
  </section>
  <div class="panel"><div class="row-between"><span>信頼</span><b>${tx(() => fmt(S.fame))}</b></div><div class="row-between small"><span class="muted">信頼によるマナ</span><b class="q">${tx(() => fmtX(fameMult()))}</b></div></div>
  ${cards || '<p class="small muted">まだ誰とも会っていません。</p>'}
  ${later}`;
}

/* --- 図鑑と古いノート（工房の中） --- */
function vJournal() {
  const got = JOURNAL.filter(j => S.journal[j.id]).length;
  const pages = JOURNAL.map((j, i) => {
    if (!S.journal[j.id]) return `<div class="page locked"><span class="no">${i + 1}ページ</span><p class="muted small">まだ読めない（${esc(j.hint)}）</p></div>`;
    const isNew = !S.jread[j.id];
    return `<article class="page">
      <div class="row-between"><span class="no">${i + 1}ページ</span>${isNew ? '<span class="tag">新しい</span>' : ''}</div>
      <h3>${esc(j.title)}</h3>
      ${j.text.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}
    </article>`;
  }).join('');
  // 開いたページは既読にする（印は次の描画で消える）
  setTimeout(() => { for (const j of JOURNAL) if (S.journal[j.id]) S.jread[j.id] = true; }, 0);
  return `
  <section class="area-head">
    <span class="eyebrow">古いノート ${got} / ${JOURNAL.length}ページ</span>
    ${help('journal', `<p class="muted small">駅前の古本屋で買った、持ち主の分からないノート。進むほど、読めるページが増えていきます。周回しても失われません。</p>`)}
  </section>
  <div class="journal">${pages}</div>`;
}
function vItems() {
  const n = regCount();
  const sections = AREAS.map((a, ai) => {
    if (!S.unlocked[a.id]) return `<h4>${esc(a.name)}（未解放）</h4>`;
    const list = sortedArea(a.id);
    const got = list.filter(i => S.reg[i.id]).length;
    const cards = list.map((m, idx) => {
      const no = 'No.' + (AREAS.indexOf(a) + 1) + '-' + String(idx + 1).padStart(2, '0');
      const kind = m.kind === 'proc' ? '加工品' : RARITY[m.r];
      if (!S.reg[m.id]) {
        return `<article class="card unknown"><span class="no"><span>${no}</span><span>${m.kind === 'proc' ? '加工品' : ''}</span></span><h3>？？？</h3><p>${m.kind === 'proc' ? '工房で作れるらしい。' : esc(a.name) + 'で見つかるらしい。'}</p></article>`;
      }
      return `<article class="card r${m.r}">
        <span class="no"><span>${no}</span><span class="rc">${kind}</span></span>
        <h3 class="rc">${esc(m.name)}</h3>
        <span class="small">価値 ${fmt(m.v)}　品質 ${fmtQ(qOf(m.id))}</span>
        <p>${esc(m.d)}</p>
        <span class="num">${m.kind === 'proc' ? '加工 ' + fmt(S.st.crafted[m.id] || 0) : '採取 ' + fmt(S.col[m.id] || 0)} ／ 分解 ${fmt(S.dis[m.id] || 0)}</span>
      </article>`;
    }).join('');
    return `<div class="row-between"><h4>${esc(a.name)}</h4><span class="small muted">${got} / ${list.length}</span></div><div class="book">${cards}</div>`;
  }).join('');
  return `
  <section class="area-head">
    <span class="eyebrow">図鑑</span>
    <h2>素材の記録</h2>
    ${help('book', `<p class="muted small">採取地ごとに、価値の低い順に並んでいます。一度手に入れたもの（採取・加工・強制錬成）は自動で記録されます。「？？？」はまだ見つけていないものです。</p>`)}
  </section>
  <div class="panel">
    <div class="row-between"><span>すべての記録</span><b>${n} / ${ITEMS.length}</b></div>
    <div class="prog"><i style="width:${n / ITEMS.length * 100}%"></i></div>
  </div>
  ${sections}`;
}

/* --- 強化 --- */
/* --- 実績の画面（強化の中） --- */
function vAch() {
  const rows = ACHS.map(a => `<div class="mis">
    <div class="hd"><h3>${esc(a.name)} <span class="small muted">${tx(() => achTier(a))}段</span></h3><span class="rw">${ACH_PERK[a.perk]} ${tx(() => fmtX(ACH_STEP ** achTier(a)))}</span></div>
    <p class="small muted">${esc(a.what)}</p>
    <div class="prog"><i ${wd(() => { const p = achPrev(a), n = achNext(a); return Math.max(0, Math.min(1, a.step ? (a.v() - p) / (n - p) : Math.log(Math.max(1, a.v()) / Math.max(1, p || 1)) / Math.log(n / Math.max(1, p || 1)))) * 100; })}></i></div>
    <div class="pv">いま ${tx(() => fmt(a.v()))}　次の段 ${tx(() => fmt(achNext(a)))}</div>
  </div>`).join('');
  return `<section class="area-head"><span class="eyebrow">実績　合計 ${tx(() => achTotal())}段</span><h2>終わりのない実績</h2>
    ${help('ach', `<p class="muted small">どの実績も段に終わりがありません。1段上がるごとに、関係する効果が ×${ACH_STEP} ずつ掛け算で伸び、周回しても残ります。</p>`)}</section>
  ${rows}`;
}

  return `${views.length > 1 ? `<div class="seg full" role="group" aria-label="強化の種類">${seg}</div>` : ''}${ui.upView === 'stone' ? vStone() : ui.upView === 'ach' ? vAch() : vShop()}`;
}

  </section>
  <div class="panel">
    <div class="row-between"><span>持っている賢者の石</span><b class="q">${tx(() => fmt(S.stones))} 個</b></div>

        ${u.once ? '' : `<button class="btn" type="button" data-act="buymax" data-id="${u.id}" ${dz(() => S.mana < upCost(u, l()))}>買えるだけ</button>`}

  }).join('');
  return `

  </section>

  <div class="panel rate-panel">
    <div class="row-between"><span>稼ぐ力</span><span class="big">${tx(() => '+' + fmt(incomeRate()) + ' /秒')}</span></div>
    <p class="small">${tx(() => { const pr = prevRatio(); return pr ? `前の周の同じ時点（${fmt(curveIdx() * CURVE_STEP / 60000)}分）と比べて ${fmtX(pr)}` : S.run > 1 ? '前の周の記録がないため、比べられません（次の周から比べます）' : '周回すると、前の周の同じ時点と比べられます'; })}</p>
    <p class="small muted">使い魔が採取したものを、すべて分解したときの1秒あたりのマナです。</p>
  </div>
  <div class="list">${cards}</div>
  `;
}

function armed(btn) {
  if (btn.classList.contains('armed')) { btn.classList.remove('armed'); return true; }
  btn.classList.add('armed');
  setTimeout(() => btn.classList.remove('armed'), 3000);
  return false;
}
main.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.help) ui.help[d.dataset.help] = d.open; }, true);
main.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'garea': ui.gArea = id; if (S.unlocked[id]) S.area = id; break;
    case 'unlock': if (canUnlock(id)) unlock(id); break;
    case 'unlockBrute': { const u = AREA[id].unlock; if (S.mana < u.brute) break; if (!armed(b)) return; S.mana -= u.brute; unlock(id); break; }
    case 'disarea': dissolveIds(rawOf(id).map(i => i.id)); break;
    case 'labview': ui.labView = id; break;
    case 'labarea': ui.labArea = id; break;
    case 'dislist': dissolveIds(labIds()); break;
    case 'dis': { const c = inv(id); const g = dissolve(id, c); S.inv[id] = 0; if (g > 0) toast(`${ITEM[id].name}を${fmt(c)}個分解: +${fmt(g)} マナ`); break; }
    case 'force': { const c = unitMana(id) * 10; if (S.mana < c) break; if (!armed(b)) return; S.mana -= c; addItem(id, 1); toast(`強制錬成で${ITEM[id].name}が生まれた`); break; }
    case 'unlockcraft': { const p = ITEM[id]; if (procOn(p)) break; if (canMake(p.in) < 1 && !fillMissing(p.in, 1)) break; if (craft(p, 1)) { toast(`${p.name}を解放しました。これからは不足分を生成で作れます`, 4000); } break; }
    case 'mkhom': { const h = makeHom(KIND[id]); if (h) homToast(h); break; }
    case 'mkhomfill': { if (S.homs.some(h => h.k === id)) break; if (fillMissing(KIND[id].in, 1)) { const h = makeHom(KIND[id]); if (h) homToast(h); } break; }
    case 'pick': { const h = homById(Number(id)); if (h) applyPick(h, b.dataset.v); break; }
    case 'gotab': goTab(id); return;
    case 'pickauto': { const n = S.homs.reduce((a, h) => a + autoPicks(h), 0); if (n) toast(`${n}件をおまかせで選びました`); break; }
    case 'fav': { S.fav = id; toast(`${KIND[id].name}を採取に連れていきます`); break; }
    case 'misarea': ui.misArea = id; break;
    case 'claim': { const m = MISS[id]; if (!m || !misOpen(m) || !ready(m)) break; if (m.deliver) S.inv[m.deliver] -= m.goal; complete(m); break; }
    case 'claimfill': { const m = MISS[id]; if (!m || !misOpen(m)) break; fillMissing({ [m.deliver]: m.goal }, 1); break; }
    case 'brute': { const m = MISS[id]; if (!m || !misOpen(m) || S.mana < m.brute) break; if (!armed(b)) return; S.mana -= m.brute; complete(m, 'マナで押し通した'); break; }
    case 'req': deliverReq(id); break;
    case 'reqfill': { const r = S.reqs[id]; if (r && !r.wait && fillMissing({ [r.id]: r.n }, 1)) deliverReq(id); break; }
    case 'reqskip': S.reqs[id] = { wait: Date.now() + 30000 }; break;
    case 'story': openPerson(id); break;
    case 'buy': buy(id); break;
    case 'upview': ui.upView = id; break;
    case 'buypu': if (buyPu(id)) toast(`「${PU[id].name}」を習得しました`); break;
    case 'prestige': { if (!armed(b)) return; const g = prestige(); if (g) { setTabs(); checkJournal(); celebrate('春のはじまり', `${S.run}周目`, `賢者の石 +${g}個。古本屋の店主「${storeLine(S.run)}」`, 'var(--r4)'); const fk = favKind(); if (fk) celebrate('育ち直し', S.homs.map(h => KIND[h.k].name).join('・'), '相棒は Lv1 から育ち直します。道のランクはそのまま残ります', 'var(--mana)', homSrc(fk, 1)); window.scrollTo(0, 0); } break; }
    case 'buymax': { let n = 0; while (n < 1000 && buy(id)) n++; if (n > 1) toast(`${UP[id].name}を${n}レベル上げました`); break; }
  }
  update();
});
function homToast(h) {

/* ===================== 演出 ===================== */
const fxLayer = document.getElementById('fx');
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } })();
const RC = r => `var(--r${r})`;
let celeQ = [], celeBusy = false, fxQuiet = false;
// 大きな瞬間: 中央のカード＋火花
function celebrate(kicker, title, sub, color, img) {
  if (fxQuiet) return;
  if (celeQ.length >= 3) celeQ.shift();
  celeQ.push({ kicker, title, sub, color, img });
  if (!celeBusy) nextCele();
}
function nextCele() {
  const c = celeQ.shift();
  if (!c) { celeBusy = false; return; }
  celeBusy = true;
  const el = document.createElement('div');
  el.className = 'cele';
  if (c.color) el.style.setProperty('--cc', c.color);
  const k = document.createElement('div'); k.className = 'ck'; k.textContent = c.kicker;
  const t = document.createElement('div'); t.className = 'ct'; t.textContent = c.title;
  if (c.img) { const im = document.createElement('img'); im.className = 'cimg'; im.src = c.img; im.alt = ''; el.append(im); }
  el.append(k, t);
  if (c.sub) { const x = document.createElement('div'); x.className = 'cs'; x.textContent = c.sub; el.append(x); }
  fxLayer.appendChild(el);
  const r = el.getBoundingClientRect();
  sparks(r.left + r.width / 2, r.top + r.height / 2, c.color, 26, 160);
  setTimeout(() => { el.remove(); nextCele(); }, 2300);
}
// 小さな瞬間: 上部の帯
let banBusyUntil = 0;
function banner(text, ok, img) {
  if (fxQuiet) return;
  const now = Date.now();
  if (now < banBusyUntil) return;
  banBusyUntil = now + 900;
  const el = document.createElement('div');
  el.className = 'banner' + (ok ? ' okc' : '') + (img ? ' withimg' : '');
  if (img) { const f = document.createElement('span'); f.className = 'face'; const im = document.createElement('img'); im.className = 'himg'; im.src = img; im.alt = ''; f.append(im); el.append(f); }
  const tx = document.createElement('span'); tx.className = 'btxt'; tx.textContent = text; el.append(tx);
  fxLayer.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}
function sparks(x, y, color, n = 14, dist = 90) {
  if (reduceMotion || fxQuiet) return;
  if (fxLayer.querySelectorAll('.spark').length > 120) return;
  for (let i = 0; i < n; i++) {
    const sp = document.createElement('span');
    sp.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = dist * (0.4 + Math.random() * 0.8);
    sp.style.left = x + 'px'; sp.style.top = y + 'px';
    sp.style.setProperty('--dx', Math.cos(a) * d + 'px');
    sp.style.setProperty('--dy', Math.sin(a) * d + 'px');
    sp.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    if (color) sp.style.setProperty('--sc', color);
    fxLayer.appendChild(sp);
    setTimeout(() => sp.remove(), 850);
  }
}

/* ===================== 通知 ===================== */
function toast(msg, ms = 2600) {
  const box = document.getElementById('toasts');
  while (box.children.length >= 3) box.firstChild.remove();

}

/* ===================== セーブ ===================== */
const LS = 'addall.save.v1';
let cloudRef = null, cloudBusy = false, lastCloud = 0, cloudStatus = '確認中';
let bootSavedAt = 0;
const hhmm = t => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function lsLoad() { try { const s = localStorage.getItem(LS); return s ? JSON.parse(s) : null; } catch { return null; } }
function lsSave() {
  try { localStorage.setItem(LS, JSON.stringify(S)); document.getElementById('lsStatus').textContent = '保存済み ' + hhmm(Date.now()); }
  catch { document.getElementById('lsStatus').textContent = 'このブラウザでは保存できません'; }
}
function saveLocal() { S.savedAt = Date.now(); lsSave(); }
function setCloudStatus(s) { cloudStatus = s; document.getElementById('cloudStatus').textContent = s; }
async function cloudSave(force) {
  if (!cloudRef || cloudBusy) return;
  if (!force && Date.now() - lastCloud < 30000) return;
  if (force && Date.now() - lastCloud < 3000) return;
  cloudBusy = true;
  S.savedAt = Date.now();
  try {
    await cloudRef.set({ json: JSON.stringify(S), savedAt: S.savedAt });
    lastCloud = Date.now();
    setCloudStatus('保存済み ' + hhmm(lastCloud));
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { cloudRef = null; setCloudStatus('この表示では保存できません'); }
    else setCloudStatus('保存に失敗しました（あとで再試行）');
  }
  cloudBusy = false;
}
function migrateOpen() { if (S._migrateOpen) { delete S._migrateOpen; checkFeats(true); } }
function adopt(obj, withOffline) {
  S = normalize(obj);
  S.pref.ver = APP_VERSION;
  shownMana = S.mana; lastManaSeen = S.mana;
  migrateOpen();
  ui.gArea = S.area; ui.misArea = S.area;
  if (withOffline && S.savedAt) { const sec = (Date.now() - S.savedAt) / 1000; if (sec > 10) offline(sec); }
  lastTick = Date.now();
  refreshReqs();
  setTabs();
  render();
  applyTheme();
}
async function cloudInit() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { setCloudStatus('このページの外では使えません'); return; }
  document.getElementById('cloudRow').hidden = false;
  const timer = setTimeout(() => { if (!cloudRef) setCloudStatus('接続できませんでした'); }, 12000);
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { clearTimeout(timer); setCloudStatus('使えません（ブラウザ内にだけ保存）'); return; }
    const uid = await user.id();
    if (!uid) { clearTimeout(timer); setCloudStatus('ログインすると使えます'); return; }
    const ref = db.doc('data/users/' + uid + '/save');
    const snap = await ref.get();
    clearTimeout(timer);
    if (snap.exists) {
      const d = snap.data();
      if (d && typeof d.json === 'string' && Number(d.savedAt) > bootSavedAt + 1000) {
        try { adopt(JSON.parse(d.json), true); toast('claude.aiのセーブデータを読み込みました'); } catch {}
      }
    }
    cloudRef = ref;
    setCloudStatus('接続済み');
    cloudSave(true);
  } catch (e) {
    clearTimeout(timer);
    setCloudStatus('接続できませんでした');
  }
}

/* ===================== ループ ===================== */
let lastTick = Date.now();
const acc = {};
let frame = 0;
function tick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt > 5) { offline(dt); }
  else {
    gainExp(EXP_SEC * dt);
    for (const a of unlockedAreas()) {
      const r = famRate(a.id);
      if (r <= 0) continue;
      acc[a.id] = (acc[a.id] || 0) + r * dt;
      if (acc[a.id] >= 1) { const k = Math.floor(acc[a.id]); acc[a.id] -= k; autoTaps(k, a.id); }
    }
  }
  if (frame % 5 === 0 || dt > 5) processAuto();
  if (frame % 10 === 0) { checkPeople(); refreshReqs(); checkJournal(); recordCurve(); checkAch(); }
  if (frame % 3 === 0) checkFeats(false);
  if (frame % 5 === 0) buddyIdle();
  if (++frame % 2 === 0 || dt > 5) update();
}

function start(data) {
  if (data && data.state) {
    S = normalize(data.state);
    if (data.ui) Object.assign(ui, data.ui);
  } else {
    const ls = lsLoad();
    if (ls) S = normalize(ls);
    ui.gArea = S.area; ui.misArea = S.area;
  }
  bootSavedAt = S.savedAt || 0;
  fxQuiet = true; setTimeout(() => { fxQuiet = false; }, 1500);
  shownMana = S.mana; lastManaSeen = S.mana;
  migrateOpen();
  setTabs();
  refreshReqs();
  render();
  applyTheme();
  notifyVersion();
  showIntro();
  if (!(data && data.state) && S.savedAt) { const sec = (Date.now() - S.savedAt) / 1000; if (sec > 10) { offline(sec); update(); } }
  lastTick = Date.now();
  setInterval(tick, 100);
  setInterval(() => { saveLocal(); cloudSave(false); }, 5000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { saveLocal(); cloudSave(true); }
    else { tick(); }
  });
  window.addEventListener('pagehide', () => { saveLocal(); });
  cloudInit();
}

try { window.claude?.hot?.snapshot?.(() => ({ state: S, ui })); } catch {}
const hot = window.claude?.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start(hot?.data ?? {});
})();
